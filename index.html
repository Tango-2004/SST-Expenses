<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>S.S.T ระบบเบิกจ่าย</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800;900&display=swap"/>
<style>
:root {
  --g:#4a7c3f; --g2:#6baa55; --g3:#d8f0c4; --g4:#3a6132;
  --red:#c0392b; --red2:#fdecea;
  --warn:#d97706; --warn2:#fef9ee;
  --blue:#2563eb; --blue2:#eff6ff;
  --bg:#f0f9e8; --surface:#fff; --border:#cce8b0;
  --text:#1e2a1a; --text2:#4a6640; --text3:#8aac78;
  --shadow:0 2px 8px rgba(40,70,20,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--text);font-size:15px}

/* LOGIN */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(150deg,#e8f7d4,#d8f0c4,#cceab8)}
.login-box{background:var(--surface);border-radius:20px;padding:40px 36px;width:340px;box-shadow:0 12px 40px rgba(30,60,40,.13);text-align:center;border-top:4px solid var(--red)}
.login-logo{width:100px;height:100px;object-fit:contain;margin-bottom:12px}
.login-title{font-size:26px;font-weight:900;color:var(--g);margin-bottom:4px}
.login-sub{font-size:12px;color:var(--text3);margin-bottom:28px}

/* APP LAYOUT */
#app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:230px;min-width:230px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);border-top:3px solid var(--red);display:flex;flex-direction:column;height:100vh}
.sb-logo{padding:18px 16px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.sb-logo img{width:42px;height:42px;object-fit:contain;border-radius:10px}
.sb-logo .brand{font-size:18px;font-weight:900;color:var(--g)}
.sb-logo .sub{font-size:10px;color:var(--text3);margin-top:1px}
.sb-user{padding:10px 16px;background:var(--g3);border-bottom:1px solid var(--border)}
.sb-user .name{font-weight:800;font-size:14px}
.sb-user .info{font-size:11px;color:var(--text2);margin-top:2px}
.sb-nav{flex:1;overflow-y:auto;padding:6px 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;font-size:14px;font-weight:600;border-left:3px solid transparent;color:var(--text)}
.nav-item:hover{background:var(--g3);color:var(--g)}
.nav-item.active{background:var(--red2);border-left-color:var(--red);color:var(--red);font-weight:800}
.nav-badge{background:#ef5350;color:#fff;border-radius:10px;font-size:10px;padding:1px 6px;margin-left:auto;font-weight:700}
.sb-footer{padding:10px 16px;border-top:1px solid var(--border)}

/* CONTENT */
.content{flex:1;min-width:0;height:100vh;overflow-y:auto;padding:24px 32px}
.page{display:none}.page.active{display:block}
.page-hd{font-size:20px;font-weight:800;color:var(--g);margin-bottom:20px;display:flex;align-items:center;gap:8px}

/* CARDS */
.card{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:20px;margin-bottom:14px}
.card-title{font-size:15px;font-weight:700;color:var(--g);margin-bottom:14px}

/* FORM */
.fg{margin-bottom:13px}
.fg label{font-size:11px;font-weight:700;color:var(--text2);display:block;margin-bottom:4px;letter-spacing:.04em;text-transform:uppercase}
.fg input,.fg select,.fg textarea{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:9px 12px;font-size:14px;font-family:inherit;color:var(--text);background:var(--surface)}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--g2);box-shadow:0 0 0 3px rgba(107,170,85,.15)}
.fg textarea{resize:vertical;min-height:70px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-wrap{max-width:560px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--g);color:#fff}.btn-primary:hover{background:var(--g2)}
.btn-primary:disabled{background:#aaa;cursor:not-allowed}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{opacity:.85}
.btn-success{background:#1a7340;color:#fff}.btn-success:hover{opacity:.85}
.btn-outline{background:var(--surface);border:1.5px solid var(--g);color:var(--g)}.btn-outline:hover{background:var(--g3)}
.btn-ghost{background:transparent;border:1.5px solid var(--border);color:var(--text2)}.btn-ghost:hover{border-color:var(--g2);color:var(--g)}
.btn-sm{padding:6px 13px;font-size:12px;border-radius:7px}
.btn-block{width:100%;justify-content:center}

/* REQUEST CARD */
.req-card{background:var(--surface);border-radius:10px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.req-stripe{height:4px}
.req-stripe.pending{background:var(--warn)}
.req-stripe.approved{background:var(--g2)}
.req-stripe.rejected{background:var(--red)}
.req-body{padding:14px 16px}
.req-type{font-weight:800;font-size:15px;color:var(--text)}
.req-meta{font-size:12px;color:var(--text3);margin-top:2px}
.req-amount{font-size:20px;font-weight:800;color:var(--g);margin:6px 0 4px}
.req-purpose{font-size:13px;color:var(--text2);margin-bottom:8px;line-height:1.5}
.req-actions{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge-pending{background:var(--warn2);color:var(--warn)}
.badge-approved{background:#e8f5e9;color:#2e7d32}
.badge-rejected{background:var(--red2);color:var(--red)}

/* MISC */
.err{color:var(--red);font-size:12px;margin-top:6px;min-height:18px}
.success-msg{background:#e8f5e9;color:#2e7d32;border-radius:8px;padding:12px 16px;font-weight:700;margin-top:10px;font-size:14px}
.empty{text-align:center;color:var(--text3);padding:48px 0;font-size:14px}
.loading{text-align:center;color:var(--text3);padding:32px 0}

/* OVERLAY */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;align-items:center;justify-content:center;padding:16px}
.overlay.open{display:flex}
.modal{background:var(--surface);border-radius:14px;width:460px;max-width:100%;max-height:90vh;overflow-y:auto;padding:24px;box-shadow:0 16px 48px rgba(0,0,0,.22)}
.modal-title{font-size:17px;font-weight:800;color:var(--g);margin-bottom:16px}
.modal-actions{display:flex;gap:10px;margin-top:16px}

/* PROGRESS BAR */
#progress-bar{position:fixed;top:0;left:0;width:0;height:3px;background:var(--g2);z-index:9999;transition:width .3s}

/* STAT */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat-tile{background:var(--surface);border-radius:10px;padding:16px;box-shadow:var(--shadow)}
.stat-num{font-size:28px;font-weight:900;color:var(--g);font-variant-numeric:tabular-nums}
.stat-label{font-size:12px;color:var(--text2);margin-top:2px}

/* DIVIDER */
hr.div{border:none;border-top:1px solid var(--border);margin:16px 0}
</style>
</head>
<body>

<div id="progress-bar"></div>

<!-- ════ LOGIN ════ -->
<div id="login-screen">
  <div class="login-box">
    <img src="logo.png" class="login-logo" alt="SST" onerror="this.style.display='none'"/>
    <div class="login-title">S.S.T</div>
    <div class="login-sub">ศรีสุธา · ระบบเบิกจ่าย</div>
    <div class="fg" style="text-align:left"><label>Username</label><input id="l-user" autocomplete="username"/></div>
    <div class="fg" style="text-align:left"><label>Password</label><input id="l-pass" type="password" autocomplete="current-password"/></div>
    <p id="l-err" class="err"></p>
    <button class="btn btn-primary btn-block" style="margin-top:6px" onclick="doLogin()">เข้าสู่ระบบ</button>
  </div>
</div>

<!-- ════ APP ════ -->
<div id="app" style="display:none">
  <div class="sidebar">
    <div class="sb-logo">
      <img src="logo.png" alt="SST" onerror="this.style.display='none'"/>
      <div><div class="brand">S.S.T</div><div class="sub">ศรีสุธา · ระบบเบิกจ่าย</div></div>
    </div>
    <div class="sb-user">
      <div class="name" id="sb-name">—</div>
      <div class="info" id="sb-info">—</div>
    </div>
    <div class="sb-nav" id="sb-nav"></div>
    <div class="sb-footer">
      <button class="btn btn-ghost btn-sm btn-block" onclick="logout()">🚪 ออกจากระบบ</button>
    </div>
  </div>

  <div class="content">
    <!-- DASHBOARD -->
    <div class="page" id="page-dashboard">
      <div class="page-hd">🏠 ภาพรวม</div>
      <div class="stat-grid" id="dash-stats"></div>
      <div id="dash-pending"></div>
    </div>

    <!-- REQUEST -->
    <div class="page" id="page-request">
      <div class="page-hd">💵 ยื่นคำขอเบิกเงิน</div>
      <div class="form-wrap">
        <div class="card">
          <div class="fg">
            <label>ประเภท</label>
            <select id="req-type" onchange="buildReqForm()">
              <option value="">— เลือกประเภท —</option>
              <option value="เบิกเงิน">💵 เบิกเงิน</option>
              <option value="เบิกซื้อของ">🛒 เบิกซื้อของ</option>
              <option value="อื่นๆ">📋 อื่นๆ</option>
            </select>
          </div>
          <div id="req-form-body"></div>
        </div>
      </div>
    </div>

    <!-- MY LIST -->
    <div class="page" id="page-mylist">
      <div class="page-hd">📂 รายการของฉัน</div>
      <div id="mylist-content"></div>
    </div>

    <!-- APPROVE -->
    <div class="page" id="page-approve">
      <div class="page-hd">✅ อนุมัติคำขอ</div>
      <div id="approve-content"></div>
    </div>
  </div>
</div>

<!-- MODAL: Approve -->
<div class="overlay" id="ov-approve">
  <div class="modal">
    <div class="modal-title">✅ อนุมัติคำขอ</div>
    <div id="approve-detail" style="font-size:14px;margin-bottom:4px"></div>
    <p id="approve-err" class="err"></p>
    <div class="modal-actions">
      <button class="btn btn-success" onclick="doApprove()">✅ อนุมัติ</button>
      <button class="btn btn-ghost" onclick="closeModal('ov-approve')">ยกเลิก</button>
    </div>
  </div>
</div>

<!-- MODAL: Reject -->
<div class="overlay" id="ov-reject">
  <div class="modal">
    <div class="modal-title">❌ ปฏิเสธคำขอ</div>
    <div id="reject-detail" style="font-size:14px;margin-bottom:10px"></div>
    <div class="fg"><label>เหตุผล</label><textarea id="reject-reason" rows="3" placeholder="ระบุเหตุผล..."></textarea></div>
    <p id="reject-err" class="err"></p>
    <div class="modal-actions">
      <button class="btn btn-danger" onclick="doReject()">❌ ปฏิเสธ</button>
      <button class="btn btn-ghost" onclick="closeModal('ov-reject')">ยกเลิก</button>
    </div>
  </div>
</div>

<script src="api.js"></script>
<script>
// ════ STATE ════
let CU = null; // current user
let _pendingId = null;

// ════ NAV ════
const NAV = [
  { id:'dashboard', label:'ภาพรวม',       ic:'🏠' },
  { id:'request',   label:'ยื่นคำขอ',      ic:'💵' },
  { id:'mylist',    label:'รายการของฉัน',  ic:'📂' },
  { id:'approve',   label:'อนุมัติ',       ic:'✅', adminOnly:true },
];

// ════ PROGRESS BAR ════
function pbShow(){ document.getElementById('progress-bar').style.width='60%' }
function pbDone(){ const b=document.getElementById('progress-bar'); b.style.width='100%'; setTimeout(()=>{ b.style.transition='none'; b.style.width='0'; setTimeout(()=>b.style.transition='width .3s',50) },300) }

// ════ LOGIN ════
document.getElementById('l-pass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

async function doLogin() {
  const u = document.getElementById('l-user').value.trim();
  const p = document.getElementById('l-pass').value;
  const errEl = document.getElementById('l-err');
  errEl.textContent = '';
  if (!u || !p) { errEl.textContent = 'กรุณากรอก Username และ Password'; return; }
  pbShow();
  const res = await login(u, p);
  pbDone();
  if (!res.ok) { errEl.textContent = res.error || 'เข้าสู่ระบบไม่ได้'; return; }
  CU = res.user;
  localStorage.setItem('sst_token', res.token);
  localStorage.setItem('sst_user', JSON.stringify(CU));
  startApp();
}

function logout() {
  localStorage.removeItem('sst_token');
  localStorage.removeItem('sst_user');
  CU = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

// ════ APP START ════
function startApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('sb-name').textContent = CU.name;
  document.getElementById('sb-info').textContent = `${CU.branch} · ${CU.role === 'admin' ? 'Admin' : 'พนักงาน'}`;
  buildNav();
  gotoPage('dashboard');
}

function buildNav() {
  const el = document.getElementById('sb-nav');
  el.innerHTML = '';
  const tabs = CU.tabs || [];
  NAV.forEach(t => {
    if (t.adminOnly && CU.role !== 'admin') return;
    if (CU.role !== 'admin' && tabs.length && !tabs.includes(t.id)) return;
    const d = document.createElement('div');
    d.className = 'nav-item';
    d.id = 'nav-' + t.id;
    d.innerHTML = `<span>${t.ic}</span>${t.label}`;
    d.onclick = () => gotoPage(t.id);
    el.appendChild(d);
  });
}

function gotoPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const pg = document.getElementById('page-' + id);
  if (pg) pg.classList.add('active');
  const nav = document.getElementById('nav-' + id);
  if (nav) nav.classList.add('active');
  switch(id) {
    case 'dashboard': loadDashboard(); break;
    case 'mylist':    loadMylist(); break;
    case 'approve':   loadApprove(); break;
  }
}

// ════ DASHBOARD ════
async function loadDashboard() {
  document.getElementById('dash-stats').innerHTML = '<div class="loading">⏳ กำลังโหลด...</div>';
  document.getElementById('dash-pending').innerHTML = '';
  pbShow();
  const res = await apiGet('getRequests', {});
  pbDone();
  if (!res.ok) { document.getElementById('dash-stats').innerHTML = `<p style="color:var(--red)">${res.error}</p>`; return; }
  const all = res.data || [];
  const mine = all.filter(r => r.requester === CU.name || r.branch === CU.branch);
  const pending = all.filter(r => r.status === 'pending');
  const approved = all.filter(r => r.status === 'approved');
  const totalAmt = approved.reduce((s,r) => s + (+r.amount||0), 0);

  document.getElementById('dash-stats').innerHTML = `
    <div class="stat-tile"><div class="stat-num">${all.length}</div><div class="stat-label">คำขอทั้งหมด</div></div>
    <div class="stat-tile"><div class="stat-num" style="color:var(--warn)">${pending.length}</div><div class="stat-label">รออนุมัติ</div></div>
    <div class="stat-tile"><div class="stat-num">฿${totalAmt.toLocaleString('th-TH',{minimumFractionDigits:0})}</div><div class="stat-label">อนุมัติแล้ว (รวม)</div></div>`;

  if (CU.role === 'admin' && pending.length > 0) {
    document.getElementById('dash-pending').innerHTML = `
      <div class="card"><div class="card-title">⏳ รออนุมัติ (${pending.length} รายการ)</div>
      ${pending.map(r => reqCardHtml(r, true)).join('')}</div>`;
  }
}

// ════ MYLIST ════
async function loadMylist() {
  const el = document.getElementById('mylist-content');
  el.innerHTML = '<div class="loading">⏳ กำลังโหลด...</div>';
  pbShow();
  const res = await apiGet('getRequests', {});
  pbDone();
  if (!res.ok) { el.innerHTML = `<p style="color:var(--red)">${res.error}</p>`; return; }
  const data = (res.data || []).sort((a,b) => (b.id||'').localeCompare(a.id||''));
  el.innerHTML = data.length ? data.map(r => reqCardHtml(r, false)).join('') : '<div class="empty">ยังไม่มีรายการ</div>';
}

// ════ APPROVE ════
async function loadApprove() {
  const el = document.getElementById('approve-content');
  el.innerHTML = '<div class="loading">⏳ กำลังโหลด...</div>';
  pbShow();
  const res = await apiGet('getRequests', { status: 'pending' });
  pbDone();
  if (!res.ok) { el.innerHTML = `<p style="color:var(--red)">${res.error}</p>`; return; }
  const data = (res.data || []).sort((a,b) => (b.id||'').localeCompare(a.id||''));
  el.innerHTML = data.length ? data.map(r => reqCardHtml(r, true)).join('') : '<div class="empty">ไม่มีรายการรออนุมัติ</div>';
}

// ════ REQUEST CARD ════
function reqCardHtml(r, showActions) {
  const st = r.status || 'pending';
  const badgeClass = { pending:'badge-pending', approved:'badge-approved', rejected:'badge-rejected' }[st] || 'badge-pending';
  const stTh = { pending:'รออนุมัติ', approved:'อนุมัติแล้ว', rejected:'ไม่อนุมัติ' }[st] || st;
  const amt = r.amount ? '฿' + Number(r.amount).toLocaleString('th-TH',{minimumFractionDigits:2}) : '-';
  const adminBtns = showActions && CU.role === 'admin' && st === 'pending' ? `
    <button class="btn btn-success btn-sm" onclick="openApprove('${r.id}')">✅ อนุมัติ</button>
    <button class="btn btn-danger btn-sm" onclick="openReject('${r.id}')">❌ ปฏิเสธ</button>` : '';
  return `
    <div class="req-card">
      <div class="req-stripe ${st}"></div>
      <div class="req-body">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div>
            <div class="req-type">${r.type || '-'}</div>
            <div class="req-meta">${r.id} · ${r.date || ''} · ${r.branch || ''}</div>
          </div>
          <span class="badge ${badgeClass}">${stTh}</span>
        </div>
        <div class="req-amount">${amt}</div>
        <div class="req-purpose">${r.purpose || ''}</div>
        <div style="font-size:12px;color:var(--text3);margin-bottom:${adminBtns ? '10px':'0'}">ผู้ขอ: <b>${r.requester || '-'}</b>${r.receiver ? ' → ผู้รับ: <b>'+r.receiver+'</b>' : ''}</div>
        ${adminBtns ? `<div class="req-actions">${adminBtns}</div>` : ''}
        ${r.rejectReason ? `<div style="font-size:12px;color:var(--red);margin-top:6px">เหตุผลปฏิเสธ: ${r.rejectReason}</div>` : ''}
      </div>
    </div>`;
}

// ════ SUBMIT REQUEST ════
function buildReqForm() {
  const type = document.getElementById('req-type').value;
  const el = document.getElementById('req-form-body');
  if (!type) { el.innerHTML = ''; return; }
  el.innerHTML = `
    <hr class="div"/>
    <div class="grid2">
      <div class="fg"><label>ผู้ขอเบิก</label><input id="rf-requester" value="${CU.name}"/></div>
      <div class="fg"><label>ผู้รับเงิน (ถ้าต่างจากผู้ขอ)</label><input id="rf-receiver" placeholder="ชื่อ"/></div>
    </div>
    <div class="fg"><label>สาขา</label>
      <select id="rf-branch">
        <option ${CU.branch==='สาขา 1'?'selected':''}>สาขา 1</option>
        <option ${CU.branch==='สาขา 2'?'selected':''}>สาขา 2</option>
      </select>
    </div>
    <div class="fg"><label>จำนวนเงิน (บาท)</label><input type="number" id="rf-amount" placeholder="0.00" min="0"/></div>
    <div class="fg"><label>วัตถุประสงค์ / รายละเอียด</label><textarea id="rf-purpose" rows="3" placeholder="ระบุรายละเอียด..."></textarea></div>
    <div class="fg"><label>เอกสารประกอบ (ถ้ามี)</label><input type="file" id="rf-file" accept="image/*" multiple/></div>
    <button class="btn btn-primary btn-block" style="margin-top:6px" id="rf-btn" onclick="submitReq()">📤 ยื่นคำขอ</button>
    <p id="rf-err" class="err"></p>
    <div id="rf-success"></div>`;
}

async function submitReq() {
  const type    = document.getElementById('req-type').value;
  const amount  = document.getElementById('rf-amount').value;
  const purpose = document.getElementById('rf-purpose').value.trim();
  const errEl   = document.getElementById('rf-err');
  errEl.textContent = '';
  if (!amount || !purpose) { errEl.textContent = 'กรุณากรอกจำนวนเงินและวัตถุประสงค์'; return; }

  const btn = document.getElementById('rf-btn');
  btn.disabled = true; btn.textContent = '⏳ กำลังส่ง...';

  // upload files
  let imageUrls = '';
  const fileInput = document.getElementById('rf-file');
  if (fileInput?.files.length) {
    for (const f of fileInput.files) {
      const b64 = await toBase64(f);
      const up = await apiPost('uploadImage', { base64: b64, filename: f.name });
      if (up.ok) imageUrls += (imageUrls ? ',' : '') + up.url;
    }
  }

  const res = await apiPost('submitRequest', {
    type, amount, purpose,
    requester: document.getElementById('rf-requester').value || CU.name,
    receiver:  document.getElementById('rf-receiver').value || '',
    branch:    document.getElementById('rf-branch').value || CU.branch,
    imageUrls,
  });

  btn.disabled = false; btn.textContent = '📤 ยื่นคำขอ';

  if (res.ok) {
    document.getElementById('rf-success').innerHTML = '<div class="success-msg">✅ ยื่นคำขอเรียบร้อยแล้ว!</div>';
    document.getElementById('req-type').value = '';
    document.getElementById('req-form-body').innerHTML = '';
    // ไปหน้า mylist
    setTimeout(() => gotoPage('mylist'), 1200);
  } else {
    errEl.textContent = res.error || 'เกิดข้อผิดพลาด';
  }
}

function toBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ════ APPROVE / REJECT ════
function openApprove(id) {
  _pendingId = id;
  document.getElementById('approve-err').textContent = '';
  document.getElementById('ov-approve').classList.add('open');
}

async function doApprove() {
  const errEl = document.getElementById('approve-err');
  errEl.textContent = '';
  pbShow();
  const res = await apiPost('approveRequest', { id: _pendingId });
  pbDone();
  if (res.ok) {
    closeModal('ov-approve');
    gotoPage('approve');
  } else { errEl.textContent = res.error; }
}

function openReject(id) {
  _pendingId = id;
  document.getElementById('reject-reason').value = '';
  document.getElementById('reject-err').textContent = '';
  document.getElementById('ov-reject').classList.add('open');
}

async function doReject() {
  const reason = document.getElementById('reject-reason').value.trim();
  const errEl = document.getElementById('reject-err');
  errEl.textContent = '';
  if (!reason) { errEl.textContent = 'กรุณาระบุเหตุผล'; return; }
  pbShow();
  const res = await apiPost('rejectRequest', { id: _pendingId, reason });
  pbDone();
  if (res.ok) {
    closeModal('ov-reject');
    gotoPage('approve');
  } else { errEl.textContent = res.error; }
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }

// ════ AUTO LOGIN ════
(function() {
  const token = localStorage.getItem('sst_token');
  const userData = localStorage.getItem('sst_user');
  if (token && userData) {
    try {
      CU = JSON.parse(userData);
      startApp();
    } catch(_) { localStorage.clear(); }
  }
})();
</script>
