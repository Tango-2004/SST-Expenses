<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>S.S.T ระบบเบิกจ่าย</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800;900&display=swap"/>
<style>
:root {
  --g:#4a7c3f; --g2:#6baa55; --g3:#eaf5e1; --g4:#2f5728;
  --red:#c0392b; --red2:#fdecea;
  --warn:#d97706; --warn2:#fef9ee;
  --blue:#2563eb; --blue2:#eff6ff;
  --bg:#f2f7ee; --surface:#fff; --border:#d4e8c0;
  --text:#1e2a1a; --text2:#4a6640; --text3:#8aac78;
  --shadow:0 1px 4px rgba(30,60,20,.08), 0 4px 16px rgba(30,60,20,.06);
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--text);font-size:15px;-webkit-font-smoothing:antialiased}

/* ── PROGRESS BAR ── */
#progress-bar{position:fixed;top:0;left:0;width:0;height:3px;background:linear-gradient(90deg,var(--g),var(--g2));z-index:9999;transition:width .3s;border-radius:0 3px 3px 0}

/* ── LOADING OVERLAY ── */
#loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.72);backdrop-filter:blur(2px);z-index:8888;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px}
#loading-overlay.show{display:flex}
.spin{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--g);border-radius:50%;animation:spin .65s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-label{font-size:13px;color:var(--text2);font-weight:600;letter-spacing:.02em}

/* ── LOGIN ── */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(140deg,#e4f3d2 0%,#d3ecb8 50%,#c6e4a8 100%)}
.login-box{background:var(--surface);border-radius:18px;padding:40px 36px 36px;width:340px;box-shadow:0 8px 32px rgba(30,60,20,.14);text-align:center}
.login-box::before{content:'';display:block;height:4px;background:linear-gradient(90deg,var(--red),#e05545);border-radius:18px 18px 0 0;margin:-40px -36px 32px;border-bottom:none}
.login-logo{width:84px;height:84px;object-fit:contain;margin-bottom:12px}
.login-title{font-size:26px;font-weight:900;color:var(--g);letter-spacing:-.01em;margin-bottom:3px}
.login-sub{font-size:12px;color:var(--text3);margin-bottom:28px;font-weight:500}

/* ── APP LAYOUT ── */
#app{display:flex;height:100vh;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{width:220px;min-width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;position:relative}
.sidebar::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--red),#e05545)}
.sb-logo{padding:20px 16px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.sb-logo img{width:38px;height:38px;object-fit:contain;border-radius:8px}
.sb-logo .brand{font-size:17px;font-weight:900;color:var(--g);letter-spacing:-.01em}
.sb-logo .sub{font-size:10px;color:var(--text3);margin-top:1px;font-weight:500}
.sb-user{padding:12px 16px;background:var(--g3);border-bottom:1px solid var(--border)}
.sb-user .name{font-weight:800;font-size:14px;color:var(--text);line-height:1.3}
.sb-user .info{font-size:11px;color:var(--text2);margin-top:3px;font-weight:500}
.sb-nav{flex:1;overflow-y:auto;padding:8px 8px}
.nav-item{display:flex;align-items:center;gap:9px;padding:10px 12px;cursor:pointer;font-size:13.5px;font-weight:600;border-radius:8px;margin-bottom:2px;color:var(--text2);transition:all .14s;border:1px solid transparent;user-select:none}
.nav-item:hover{background:var(--g3);color:var(--g)}
.nav-item.active{background:var(--red2);color:var(--red);font-weight:800;border-color:#f7c8c3}
.nav-badge{background:#ef5350;color:#fff;border-radius:10px;font-size:10px;padding:1px 6px;margin-left:auto;font-weight:700;min-width:18px;text-align:center}
.sb-footer{padding:12px 8px;border-top:1px solid var(--border)}

/* ── CONTENT ── */
.content{flex:1;min-width:0;height:100vh;overflow-y:auto;background:var(--bg)}
.page{display:none;padding:28px 32px}.page.active{display:block}

/* ── PAGE HEADER ── */
.page-hd{font-size:19px;font-weight:800;color:var(--g);margin-bottom:22px;display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
.page-hd-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.page-hd-row .page-hd{margin-bottom:0}

/* ── CARDS ── */
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px;border:1px solid rgba(210,230,190,.6)}
.card-title{font-size:14px;font-weight:700;color:var(--g);margin-bottom:14px;display:flex;align-items:center;gap:6px}

/* ── FORM ── */
.fg{margin-bottom:14px}
.fg label{font-size:11.5px;font-weight:700;color:var(--text2);display:block;margin-bottom:5px;letter-spacing:.03em}
.fg input,.fg select,.fg textarea{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:9px 12px;font-size:14px;font-family:inherit;color:var(--text);background:var(--surface);transition:border-color .14s,box-shadow .14s}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--g2);box-shadow:0 0 0 3px rgba(107,170,85,.14)}
.fg textarea{resize:vertical;min-height:72px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-wrap{max-width:560px}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:all .14s;white-space:nowrap;line-height:1}
.btn:disabled{opacity:.55;cursor:not-allowed;pointer-events:none}
.btn-primary{background:var(--g);color:#fff;box-shadow:0 2px 6px rgba(74,124,63,.25)}
.btn-primary:hover:not(:disabled){background:var(--g4);box-shadow:0 3px 10px rgba(74,124,63,.32)}
.btn-danger{background:var(--red);color:#fff;box-shadow:0 2px 6px rgba(192,57,43,.2)}
.btn-danger:hover:not(:disabled){opacity:.88}
.btn-success{background:#196d38;color:#fff;box-shadow:0 2px 6px rgba(25,109,56,.2)}
.btn-success:hover:not(:disabled){opacity:.88}
.btn-outline{background:var(--surface);border:1.5px solid var(--g);color:var(--g)}
.btn-outline:hover:not(:disabled){background:var(--g3)}
.btn-ghost{background:transparent;border:1.5px solid var(--border);color:var(--text2)}
.btn-ghost:hover:not(:disabled){border-color:var(--g2);color:var(--g);background:var(--g3)}
.btn-warn{background:var(--warn);color:#fff}
.btn-warn:hover:not(:disabled){opacity:.88}
.btn-sm{padding:6px 13px;font-size:12px;border-radius:7px}
.btn-block{width:100%}

/* ── REQUEST CARD ── */
.req-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden;border:1px solid rgba(210,230,190,.5);transition:box-shadow .14s}
.req-card:hover{box-shadow:0 2px 8px rgba(30,60,20,.12),0 6px 20px rgba(30,60,20,.08)}
.req-stripe{height:4px}
.req-stripe.pending{background:var(--warn)}
.req-stripe.approved{background:var(--g2)}
.req-stripe.rejected{background:var(--red)}
.req-body{padding:14px 16px}
.req-type{font-weight:800;font-size:15px;color:var(--text)}
.req-meta{font-size:12px;color:var(--text3);margin-top:2px;font-weight:500}
.req-amount{font-size:21px;font-weight:900;color:var(--g);margin:6px 0 4px;letter-spacing:-.01em}
.req-purpose{font-size:13px;color:var(--text2);margin-bottom:8px;line-height:1.55}
.req-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* ── BADGES ── */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.02em}
.badge-pending{background:var(--warn2);color:var(--warn)}
.badge-approved{background:#e3f5e9;color:#1a6e36}
.badge-rejected{background:var(--red2);color:var(--red)}

/* ── MISC ── */
.err{color:var(--red);font-size:12px;margin-top:6px;min-height:18px;font-weight:600}
.success-msg{background:#e3f5e9;color:#1a6e36;border-radius:8px;padding:12px 16px;font-weight:700;margin-top:10px;font-size:14px;border:1px solid #b2dfcc}
.empty{text-align:center;color:var(--text3);padding:52px 0;font-size:14px;font-weight:500}
.loading{text-align:center;color:var(--text3);padding:36px 0;font-size:13px;font-weight:500}
hr.div{border:none;border-top:1px solid var(--border);margin:16px 0}

/* ── OVERLAY / MODAL ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:1000;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(1px)}
.overlay.open{display:flex}
.modal{background:var(--surface);border-radius:14px;width:490px;max-width:100%;max-height:90vh;overflow-y:auto;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.24),0 4px 16px rgba(0,0,0,.12)}
.modal-title{font-size:17px;font-weight:800;color:var(--g);margin-bottom:18px;display:flex;align-items:center;gap:7px;letter-spacing:-.01em}
.modal-actions{display:flex;gap:10px;margin-top:18px}

/* ── STAT TILES ── */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
.stat-tile{background:var(--surface);border-radius:var(--radius);padding:18px 16px;box-shadow:var(--shadow);border:1px solid rgba(210,230,190,.6)}
.stat-num{font-size:30px;font-weight:900;color:var(--g);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat-label{font-size:12px;color:var(--text2);margin-top:3px;font-weight:500}

/* ── TABLE ── */
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{background:var(--g3);color:var(--g4);font-weight:700;padding:10px 12px;text-align:left;border-bottom:2px solid var(--border);white-space:nowrap;letter-spacing:.02em}
.data-table td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.data-table tbody tr:hover td{background:#f6faf0}
.table-wrap{overflow-x:auto;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid rgba(210,230,190,.6)}
.table-wrap .data-table{border-radius:var(--radius);overflow:hidden}
.table-wrap .data-table th:first-child{border-radius:var(--radius) 0 0 0}
.table-wrap .data-table th:last-child{border-radius:0 var(--radius) 0 0}

/* ── ROLE / STATUS ── */
.role-badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11px;font-weight:700}
.role-admin{background:var(--red2);color:var(--red)}
.role-user{background:var(--g3);color:var(--g4)}
.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.status-active{background:#2e9d52}.status-inactive{background:#bbb}

/* ── TAB CHIPS (permission selector) ── */
.tab-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);user-select:none;transition:all .14s}
.tab-chip.on{background:var(--g);color:#fff;border-color:var(--g)}

/* ── DATE CHIPS ── */
.date-chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.date-ok{background:#e3f5e9;color:#1a6e36}
.date-warn{background:var(--warn2);color:var(--warn)}
.date-urgent{background:var(--red2);color:var(--red)}
.date-none{background:#f0f0f0;color:#aaa}

/* ── VEHICLE PLATE ── */
.veh-plate{font-size:15px;font-weight:900;color:var(--g);letter-spacing:.04em}

/* ── VEHICLE CARDS GRID ── */
.veh-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.veh-card{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;box-shadow:var(--shadow);cursor:pointer;transition:all .16s;overflow:hidden;user-select:none}
.veh-card:hover{border-color:var(--g2);box-shadow:0 4px 18px rgba(74,124,63,.15);transform:translateY(-2px)}
.veh-card.veh-expired{border-color:var(--red);background:var(--red2)}
.veh-card-head{background:var(--g3);padding:12px 14px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.veh-card-ico{font-size:22px;line-height:1}
.veh-card-plate{font-size:17px;font-weight:900;color:var(--g);letter-spacing:.04em}
.veh-card-type{font-size:11px;color:var(--text2);font-weight:600;margin-top:1px}
.veh-card-body{padding:10px 14px 12px;display:flex;flex-direction:column;gap:6px}
.veh-card-row{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.veh-card-lbl{color:var(--text3);font-weight:600}
.veh-card-branch{background:var(--g3);color:var(--g);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700}
.veh-card-expired-badge{display:inline-block;background:var(--red2);color:var(--red);border-radius:6px;font-size:10px;font-weight:800;padding:1px 7px;border:1px solid #f7c8c3}

/* ── VEHICLE DETAIL DRAWER ── */
.veh-drawer{display:none;background:var(--surface);border:1.5px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:20px 22px;margin-bottom:16px}
.veh-drawer.open{display:block}
.veh-drawer-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.veh-drawer-close{margin-left:auto;background:none;border:1.5px solid var(--border);border-radius:8px;cursor:pointer;font-size:14px;padding:4px 10px;color:var(--text2);font-family:inherit;font-weight:700;transition:all .12s}
.veh-drawer-close:hover{background:var(--red2);border-color:var(--red);color:var(--red)}

/* ── PAGE TABS (vehicles) ── */
.page-tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--surface);border-radius:10px;padding:4px;box-shadow:var(--shadow);border:1px solid var(--border);width:fit-content}
.page-tab{padding:8px 18px;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer;color:var(--text2);transition:all .14s;white-space:nowrap;user-select:none}
.page-tab:hover{background:var(--g3);color:var(--g)}
.page-tab.active{background:var(--g);color:#fff;box-shadow:0 2px 6px rgba(74,124,63,.3)}

/* ── ALERTS CARD ── */
.alert-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;border-left:4px solid var(--red);overflow:hidden;border:1px solid rgba(192,57,43,.15)}
.alert-card-head{padding:13px 16px;background:#fef6f5;border-bottom:1px solid rgba(192,57,43,.1);display:flex;align-items:center;gap:7px}
.alert-card-head-title{font-size:14px;font-weight:800;color:var(--red)}
.alert-row{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border)}
.alert-row:last-child{border-bottom:none}

/* ── FILTER SELECT ── */
.filter-select{padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;font-weight:600;color:var(--text);background:var(--surface);cursor:pointer;transition:border-color .14s}
.filter-select:focus{outline:none;border-color:var(--g2)}

/* ── PRINT ── */
@media print {
  body * { visibility: hidden; }
  #print-area, #print-area * { visibility: visible; }
  #print-area { position: fixed; inset: 0; background: #fff; padding: 20mm; font-family: 'Sarabun', sans-serif; }
}
</style>
</head>
<body>

<div id="progress-bar"></div>
<div id="loading-overlay">
  <div class="spin"></div>
  <div class="loading-label">กำลังโหลด...</div>
</div>

<!-- ════ LOGIN ════ -->
<div id="login-screen">
  <div class="login-box">
    <img src="logo.png" class="login-logo" alt="SST" onerror="this.style.display='none'"/>
    <div class="login-title">S.S.T</div>
    <div class="login-sub">ศรีสุธา · ระบบเบิกจ่าย</div>
    <div class="fg" style="text-align:left"><label>Username</label>
      <input id="l-user" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('l-pass').focus()"/>
    </div>
    <div class="fg" style="text-align:left"><label>Password</label>
      <input id="l-pass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"/>
    </div>
    <p id="l-err" class="err"></p>
    <button class="btn btn-primary btn-block" style="margin-top:8px" id="login-btn" onclick="doLogin()">เข้าสู่ระบบ</button>
  </div>
</div>

<!-- ════ APP ════ -->
<div id="app" style="display:none">
  <div class="sidebar">
    <div class="sb-logo">
      <img src="logo.png" alt="SST" onerror="this.style.display='none'"/>
      <div><div class="brand">S.S.T</div><div class="sub">ศรีสุธา · ระบบเบิกจ่าย</div></div>
    </div>
    <div class="sb-user">
      <div class="name" id="sb-name">—</div>
      <div class="info" id="sb-info">—</div>
    </div>
    <div class="sb-nav" id="sb-nav"></div>
    <div class="sb-footer">
      <button class="btn btn-ghost btn-sm btn-block" onclick="doLogout()">🚪 ออกจากระบบ</button>
    </div>
  </div>

  <div class="content">

    <!-- DASHBOARD -->
    <div class="page" id="page-dashboard">
      <div class="page-hd">🏠 ภาพรวม</div>
      <div class="stat-grid" id="dash-stats"></div>
      <div id="dash-alerts"></div>
      <div id="dash-pending"></div>
    </div>

    <!-- REQUEST -->
    <div class="page" id="page-request">
      <div class="page-hd">💵 ยื่นคำขอ</div>
      <div class="form-wrap">
        <div class="card">
          <div class="fg">
            <label>ประเภทคำขอ</label>
            <select id="req-type" onchange="buildReqForm()">
              <option value="">— เลือกประเภท —</option>
              <option value="เบิกเงิน">💵 เบิกเงิน</option>
              <option value="เบิกน้ำมัน">⛽ เบิกน้ำมัน</option>
              <option value="เบิกซื้อของ">🛒 เบิกซื้อของ</option>
              <option value="อื่นๆ">📋 อื่นๆ</option>
            </select>
          </div>
          <div id="req-form-body"></div>
        </div>
      </div>
    </div>

    <!-- MY LIST -->
    <div class="page" id="page-mylist">
      <div class="page-hd">📂 รายการของฉัน</div>
      <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap">
        <select id="ml-status" class="filter-select" onchange="loadMylist()">
          <option value="">ทุกสถานะ</option>
          <option value="pending">รออนุมัติ</option>
          <option value="approved">อนุมัติแล้ว</option>
          <option value="rejected">ไม่อนุมัติ</option>
        </select>
      </div>
      <div id="mylist-content"></div>
    </div>

    <!-- APPROVE -->
    <div class="page" id="page-approve">
      <div class="page-hd">✅ อนุมัติคำขอ</div>
      <div id="approve-content"></div>
    </div>

    <!-- VEHICLES — tabbed layout -->
    <div class="page" id="page-vehicles">
      <div class="page-hd-row">
        <div class="page-hd" style="margin-bottom:0">🚗 รถ / น้ำมัน</div>
        <button class="btn btn-primary btn-sm" id="add-veh-btn" style="display:none" onclick="openAddVehicle()">+ เพิ่มรถ</button>
      </div>
      <div id="veh-alerts-wrap"></div>
      <div class="page-tabs">
        <div class="page-tab active" id="vtab-list" onclick="switchVehTab('list')">📋 รายการรถ</div>
        <div class="page-tab" id="vtab-fuel" onclick="switchVehTab('fuel')">⛽ ประวัติน้ำมัน</div>
      </div>
      <div id="veh-tab-list"></div>
      <div id="veh-tab-fuel" style="display:none"></div>
    </div>

    <!-- USERS -->
    <div class="page" id="page-users">
      <div class="page-hd-row">
        <div class="page-hd" style="margin-bottom:0">👤 จัดการผู้ใช้</div>
        <button class="btn btn-primary btn-sm" onclick="openCreateUser()">+ เพิ่มผู้ใช้</button>
      </div>
      <div id="users-content"></div>
    </div>

  </div>
</div>

<!-- PRINT AREA -->
<div id="print-area" style="display:none"></div>

<!-- MODAL: Create User -->
<div class="overlay" id="ov-create-user">

<script src="api.js"></script>
<script>
// ════ STATE ════
let CU = null;
let _pendingId = null;
let _resetUserId = null;
let _resetIsOwnPw = false;
let _vehTab = 'list';
let _vehiclesCache = null;

// ════ NAV ════
const NAV = [
  { id:'dashboard', label:'ภาพรวม',       ic:'🏠' },
  { id:'request',   label:'ยื่นคำขอ',      ic:'💵' },
  { id:'mylist',    label:'รายการของฉัน',  ic:'📂' },
  { id:'approve',   label:'อนุมัติ',       ic:'✅', adminOnly:true },
  { id:'vehicles',  label:'รถ / น้ำมัน',   ic:'🚗' },
  { id:'users',     label:'จัดการผู้ใช้',  ic:'👤', adminOnly:true },
];

// ════ PROGRESS BAR + LOADING ════
let _loadCount = 0;
function pbShow(withOverlay=false){
  document.getElementById('progress-bar').style.width='60%';
  if (withOverlay) { _loadCount++; document.getElementById('loading-overlay').classList.add('show'); }
}
function pbDone(){
  const b=document.getElementById('progress-bar');
  b.style.width='100%';
  setTimeout(()=>{ b.style.transition='none'; b.style.width='0'; setTimeout(()=>b.style.transition='width .3s',50) },300);
  _loadCount = Math.max(0, _loadCount-1);
  if (_loadCount === 0) document.getElementById('loading-overlay').classList.remove('show');
}
function pbShowFull(){ pbShow(true); }

// ════ BUTTON LOADING HELPERS ════
function btnLoading(id, text='⏳ กำลังบันทึก...') {
  const btn = document.getElementById(id);
  if (!btn) return;
  btn._origText = btn.textContent;
  btn.disabled = true;
  btn.textContent = text;
}
function btnRestore(id) {
  const btn = document.getElementById(id);
  if (!btn) return;
  btn.disabled = false;
  if (btn._origText) btn.textContent = btn._origText;
}

// ════ LOGIN ════
async function doLogin() {
  const u = document.getElementById('l-user').value.trim();
  const p = document.getElementById('l-pass').value;
  const errEl = document.getElementById('l-err');
  errEl.textContent = '';
  if (!u || !p) { errEl.textContent = 'กรุณากรอก Username และ Password'; return; }
  btnLoading('login-btn', '⏳ กำลังเข้าสู่ระบบ...');
  pbShow();
  const res = await login(u, p);
  pbDone();
  btnRestore('login-btn');
  if (!res.ok) { errEl.textContent = res.error || 'เข้าสู่ระบบไม่ได้'; return; }
  CU = res.user;
  startApp();
}

function doLogout() {
  CU = null;
  logout();
}

// ════ APP START ════
function startApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('sb-name').textContent = CU.name;
  document.getElementById('sb-info').textContent = `${CU.branch} · ${CU.role === 'admin' ? 'Admin' : 'พนักงาน'}`;
  buildNav();
  gotoPage('dashboard');
}

function buildNav() {
  const el = document.getElementById('sb-nav');
  el.innerHTML = '';
  const tabs = Array.isArray(CU.tabs) ? CU.tabs : (CU.tabs||'').split(',').filter(Boolean);
  NAV.forEach(t => {
    if (t.adminOnly && CU.role !== 'admin') return;
    if (CU.role !== 'admin' && tabs.length && !tabs.includes(t.id)) return;
    const d = document.createElement('div');
    d.className = 'nav-item';
    d.id = 'nav-' + t.id;
    d.innerHTML = `<span>${t.ic}</span>${t.label}<span id="badge-${t.id}" class="nav-badge" style="display:none"></span>`;
    d.onclick = () => gotoPage(t.id);
    el.appendChild(d);
  });
}

function gotoPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const pg = document.getElementById('page-' + id);
  if (pg) pg.classList.add('active');
  const nav = document.getElementById('nav-' + id);
  if (nav) nav.classList.add('active');
  switch(id) {
    case 'dashboard': loadDashboard(); break;
    case 'mylist':    loadMylist(); break;
    case 'approve':   loadApprove(); break;
    case 'vehicles':  loadVehicles(); break;
    case 'users':     loadUsers(); break;
  }
}

// ════ DASHBOARD ════
async function loadDashboard() {
  document.getElementById('dash-stats').innerHTML = '<div class="loading">⏳ กำลังโหลด...</div>';
  document.getElementById('dash-pending').innerHTML = '';
  document.getElementById('dash-alerts').innerHTML = '';
  pbShowFull();
  const res = await apiGet('getRequests', {}, {bust:true});
  pbDone();
  if (!res.ok) { document.getElementById('dash-stats').innerHTML = `<p style="color:var(--red)">${res.error}</p>`; return; }
  const all = res.data || [];
  const myItems = CU.role === 'admin' ? all : all.filter(r => r.branch === CU.branch);
  const pending = all.filter(r => r.status === 'pending');
  const approved = all.filter(r => r.status === 'approved');
  const totalAmt = approved.reduce((s,r) => s + (+r.amount||0), 0);

  setBadge('approve', pending.length);

  document.getElementById('dash-stats').innerHTML = `
    <div class="stat-tile"><div class="stat-num">${myItems.length}</div><div class="stat-label">คำขอของฉัน</div></div>
    <div class="stat-tile"><div class="stat-num" style="color:var(--warn)">${pending.length}</div><div class="stat-label">รออนุมัติ</div></div>
    <div class="stat-tile"><div class="stat-num">฿${totalAmt.toLocaleString('th-TH',{minimumFractionDigits:0})}</div><div class="stat-label">อนุมัติแล้ว (รวม)</div></div>`;

  if (CU.role === 'admin' && pending.length > 0) {
    document.getElementById('dash-pending').innerHTML = `
      <div class="card"><div class="card-title">⏳ รออนุมัติ (${pending.length} รายการ)</div>
      ${pending.slice(0,5).map(r => reqCardHtml(r, true)).join('')}
      ${pending.length>5 ? `<div style="text-align:center;padding:10px"><button class="btn btn-outline btn-sm" onclick="gotoPage('approve')">ดูทั้งหมด (${pending.length})</button></div>` : ''}
      </div>`;
  }
}

function setBadge(id, count) {
  const b = document.getElementById('badge-'+id);
  if (!b) return;
  if (count > 0) { b.textContent = count; b.style.display = ''; }
  else { b.style.display = 'none'; }
}

// ════ MYLIST ════
async function loadMylist() {
  const el = document.getElementById('mylist-content');
  el.innerHTML = '<div class="loading">⏳ กำลังโหลด...</div>';
  pbShowFull();
  const statusFilter = document.getElementById('ml-status')?.value || '';
  const res = await apiGet('getRequests', {}, {bust:true});
  pbDone();
  if (!res.ok) { el.innerHTML = `<p style="color:var(--red)">${res.error}</p>`; return; }
  let data = CU.role === 'admin' ? (res.data || []) : (res.data || []).filter(r => r.branch === CU.branch);
  if (statusFilter) data = data.filter(r => r.status === statusFilter);
  data.sort((a,b) => (b.id||'').localeCompare(a.id||''));
  el.innerHTML = data.length ? data.map(r => reqCardHtml(r, false, true)).join('') : '<div class="empty">ยังไม่มีรายการ</div>';
}

// ════ APPROVE ════
async function loadApprove() {
  if (CU.role !== 'admin') { document.getElementById('approve-content').innerHTML = '<div class="empty">ไม่มีสิทธิ์เข้าถึง</div>'; return; }
  const el = document.getElementById('approve-content');
  el.innerHTML = '<div class="loading">⏳ กำลังโหลด...</div>';
  pbShowFull();
  const res = await apiGet('getRequests', {status:'pending'}, {bust:true});
  pbDone();
  if (!res.ok) { el.innerHTML = `<p style="color:var(--red)">${res.error}</p>`; return; }
  const data = (res.data || []).sort((a,b) => (b.id||'').localeCompare(a.id||''));
  setBadge('approve', data.length);
  el.innerHTML = data.length ? data.map(r => reqCardHtml(r, true)).join('') : '<div class="empty">ไม่มีรายการรออนุมัติ ✅</div>';
}

// ════ REQUEST CARD ════
function reqCardHtml(r, showActions, showPrint=false) {
  const st = r.status || 'pending';
  const badgeClass = { pending:'badge-pending', approved:'badge-approved', rejected:'badge-rejected' }[st] || 'badge-pending';
  const stTh = { pending:'รออนุมัติ', approved:'อนุมัติแล้ว', rejected:'ไม่อนุมัติ' }[st] || st;
  const amt = r.amount ? '฿' + Number(r.amount).toLocaleString('th-TH',{minimumFractionDigits:2}) : '-';
  const adminBtns = showActions && CU.role === 'admin' && st === 'pending' ? `
    <button class="btn btn-success btn-sm" onclick="openApprove('${r.id}','${(r.requester||'').replace(/'/g,"\\'")}','${amt}')">✅ อนุมัติ</button>
    <button class="btn btn-danger btn-sm" onclick="openReject('${r.id}','${(r.requester||'').replace(/'/g,"\\'")}')">❌ ปฏิเสธ</button>` : '';
  const printBtn = showPrint ? `<button class="btn btn-warn btn-sm" onclick="printRequest(${JSON.stringify(r).replace(/"/g,'&quot;')})">🖨️ พิมพ์ใบเบิก</button>` : '';
  return `
    <div class="req-card">
      <div class="req-stripe ${st}"></div>
      <div class="req-body">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
          <div>
            <div class="req-type">${r.type || '-'}</div>
            <div class="req-meta">${r.id} · ${r.date || ''} · ${r.branch || ''}</div>
          </div>
          <span class="badge ${badgeClass}" style="flex-shrink:0">${stTh}</span>
        </div>
        <div class="req-amount">${amt}</div>
        <div class="req-purpose">${r.purpose || ''}</div>
        ${r.noReceipt === 'true' ? `<div style="font-size:11px;color:var(--warn);margin-bottom:6px;font-weight:600">⚠️ ไม่มีใบเสร็จ${r.noReceiptReason ? ': '+r.noReceiptReason : ''}</div>` : ''}
        <div style="font-size:12px;color:var(--text3);font-weight:500">ผู้ขอ: <b style="color:var(--text2)">${r.requester || '-'}</b>${r.receiver ? ' → ผู้รับ: <b style="color:var(--text2)">'+r.receiver+'</b>' : ''}${r.approvedBy ? ' · อนุมัติโดย: <b style="color:var(--text2)">'+r.approvedBy+'</b>' : ''}</div>
        ${(adminBtns||printBtn) ? `<div class="req-actions">${adminBtns}${printBtn}</div>` : ''}
        ${r.rejectReason ? `<div style="font-size:12px;color:var(--red);margin-top:6px;font-weight:600">เหตุผลปฏิเสธ: ${r.rejectReason}</div>` : ''}
      </div>
    </div>`;
}

// ════ PRINT ════
function printRequest(r) {
  const amtNum  = Number(r.amount || 0);
  const amtFmt  = amtNum.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const today   = new Date();
  const dateTHLong = today.toLocaleDateString('th-TH', { day:'numeric', month:'long', year:'numeric' });

  // Thai number to words (shared helper — same as previewNoReceiptDoc)
  function numToWords(n) {
    const ones = ['','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'];
    const tens = ['','สิบ','ยี่สิบ','สามสิบ','สี่สิบ','ห้าสิบ','หกสิบ','เจ็ดสิบ','แปดสิบ','เก้าสิบ'];
    if (n === 0) return 'ศูนย์บาทถ้วน';
    const [intPart, decPart] = String(n.toFixed(2)).split('.');
    const int = parseInt(intPart);
    function convertInt(num) {
      if (num === 0) return '';
      if (num < 10) return ones[num];
      if (num < 100) { const t=Math.floor(num/10),o=num%10; return tens[t]+(o?(t===1&&o===1?'เอ็ด':ones[o]):''); }
      if (num < 1000) { const h=Math.floor(num/100); return (h>1?ones[h]:'')+' ร้อย'+convertInt(num%100); }
      if (num < 10000) { const th=Math.floor(num/1000); return (th>1?ones[th]:'')+' พัน'+convertInt(num%1000); }
      if (num < 100000) { const tth=Math.floor(num/10000); return (tth>1?ones[tth]:'')+' หมื่น'+convertInt(num%10000); }
      if (num < 1000000) { const hth=Math.floor(num/100000); return (hth>1?ones[hth]:'')+' แสน'+convertInt(num%100000); }
      return convertInt(Math.floor(num/1000000))+' ล้าน'+convertInt(num%1000000);
    }
    let result = convertInt(int) + 'บาท';
    const dec = parseInt(decPart);
    result += dec > 0 ? convertInt(dec) + 'สตางค์' : 'ถ้วน';
    return result;
  }

  const win = window.open('', '_blank', 'width=760,height=960');
  win.document.write(`<!DOCTYPE html>

function numberToThai(n) {
  const ones = ['','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'];
  const tens = ['','สิบ','ยี่สิบ','สามสิบ','สี่สิบ','ห้าสิบ','หกสิบ','เจ็ดสิบ','แปดสิบ','เก้าสิบ'];
  function convert(num) {
    if (num === 0) return '';
    if (num < 10) return ones[num];
    if (num < 100) return tens[Math.floor(num/10)] + ones[num%10];
    if (num < 1000) return ones[Math.floor(num/100)] + 'ร้อย' + convert(num%100);
    if (num < 10000) return ones[Math.floor(num/1000)] + 'พัน' + convert(num%1000);
    if (num < 100000) return ones[Math.floor(num/10000)] + 'หมื่น' + convert(num%10000);
    if (num < 1000000) return ones[Math.floor(num/100000)] + 'แสน' + convert(num%100000);
    return ones[Math.floor(num/1000000)] + 'ล้าน' + convert(num%1000000);
  }
  const intPart = Math.floor(n);
  const decPart = Math.round((n - intPart) * 100);
  let result = convert(intPart) + 'บาท';
  result += decPart > 0 ? convert(decPart) + 'สตางค์' : 'ถ้วน';
  return result || 'ศูนย์บาทถ้วน';
}

async function submitReq() {
  const type    = document.getElementById('req-type').value;
  const amount  = document.getElementById('rf-amount')?.value;
  const purpose = (document.getElementById('rf-purpose')?.value || '').trim();
  const errEl   = document.getElementById('rf-err');
  errEl.textContent = '';
  if (!type) { errEl.textContent = 'กรุณาเลือกประเภท'; return; }
  if (!amount || isNaN(amount)) { errEl.textContent = 'กรุณากรอกจำนวนเงิน'; return; }
  if (!purpose) { errEl.textContent = 'กรุณากรอกวัตถุประสงค์'; return; }

  btnLoading('rf-btn', '⏳ กำลังส่ง...');

  let imageUrls = '';
  const fileInput = document.getElementById('rf-file');
  if (fileInput?.files.length) {
    const now = new Date();
    const uploadYear  = String(now.getFullYear() + 543); // ปีพุทธศักราช
    const uploadMonth = String(now.getMonth() + 1).padStart(2, '0') + '-' +
      ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][now.getMonth()];
    const uploadBranch = document.getElementById('rf-branch')?.value || CU?.branch || 'ไม่ระบุ';
    const uploadCategory = document.getElementById('req-type')?.value || 'ทั่วไป';
    for (const f of fileInput.files) {
      try {
        const b64 = await toBase64(f);
        const up = await apiPost('uploadImage', {
          base64: b64, filename: f.name,
          category: uploadCategory,
          branch: uploadBranch,
          year: uploadYear,
          month: uploadMonth,
        });
        if (up.ok) imageUrls += (imageUrls ? ',' : '') + up.url;
      } catch(e) { console.warn('upload failed', e); }
    }
  }

  const noReceipt = document.getElementById('rf-noreceipt')?.checked ? 'true' : '';
  const noReceiptReason = document.getElementById('rf-noreason')?.value || '';
  const vehiclePlate = document.getElementById('rf-plate')?.value || '';

  let finalPurpose = purpose;
  if (type === 'เบิกน้ำมัน' && vehiclePlate) {
    const liters = document.getElementById('rf-liters')?.value || '';
    finalPurpose = `[ทะเบียน: ${vehiclePlate}${liters ? ' / '+liters+' ล.' : ''}] ${purpose}`;
  }

  const res = await apiPost('submitRequest', {
    type, amount: parseFloat(amount),
    purpose: finalPurpose,
    requester: document.getElementById('rf-requester')?.value || CU.name,
    receiver:  document.getElementById('rf-receiver')?.value || '',
    branch:    document.getElementById('rf-branch')?.value || CU.branch,
    vehiclePlate, noReceipt, noReceiptReason, imageUrls,
  });

  btnRestore('rf-btn');

  if (res.ok) {
    document.getElementById('rf-success').innerHTML = '<div class="success-msg">✅ ยื่นคำขอเรียบร้อยแล้ว!</div>';
    document.getElementById('req-type').value = '';
    document.getElementById('req-form-body').innerHTML = '';
    setTimeout(() => gotoPage('mylist'), 1200);
  } else {
    errEl.textContent = res.error || 'เกิดข้อผิดพลาด';
  }
}

function toBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function loadVehicles() {
  // Show add button for admin
  const addBtn = document.getElementById('add-veh-btn');
  if (addBtn) addBtn.style.display = CU.role === 'admin' ? '' : 'none';

  // Reset to list tab
  switchVehTab('list');

  const alertsEl = document.getElementById('veh-alerts-wrap');
  const listEl   = document.getElementById('veh-tab-list');
  const fuelEl   = document.getElementById('veh-tab-fuel');
  listEl.innerHTML = '<div class="loading">⏳ กำลังโหลด...</div>';
  fuelEl.innerHTML = '';
  alertsEl.innerHTML = '';

  pbShowFull();
  const [vRes, aRes, rRes] = await Promise.all([
    apiGet('getVehicles', {}, {bust:true}),
    apiGet('getAlerts',   {}, {bust:true}),
    apiGet('getRequests', {}, {bust:false}),
  ]);
  pbDone();

  // ── ALERTS ──
  const alerts = aRes.ok ? (aRes.data || []) : [];
  if (alerts.length) {
    alertsEl.innerHTML = `
      <div class="alert-card">
        <div class="alert-card-head" style="border-left:4px solid var(--red)">
          <span style="font-size:16px">⚠️</span>
          <span class="alert-card-head-title">แจ้งเตือนวันหมดอายุ (${alerts.length} รายการ)</span>
        </div>
        ${alerts.map(a => `
          <div class="alert-row">
            <div>
              <div style="font-weight:800;font-size:13px">${a.plate} <span style="font-weight:500;color:var(--text2)">· ${a.label}</span></div>
              <div style="font-size:12px;color:var(--text3);margin-top:2px">หมดอายุ: ${a.expDate} · ${a.branch}</div>
            </div>
            <span class="date-chip ${a.level==='urgent'?'date-urgent':'date-warn'}" style="flex-shrink:0">${a.daysLeft<=0?'หมดแล้ว':a.daysLeft+' วัน'}</span>
          </div>`).join('')}
      </div>`;
  }

  // ── TAB 1: รายการรถ ──
  if (!vRes.ok) {
    listEl.innerHTML = `<p style="color:var(--red);padding:16px">${vRes.error}</p>`;
  } else {
    const vehicles = vRes.data || [];
    if (!vehicles.length) {
      listEl.innerHTML = '<div class="empty">ยังไม่มีรถในระบบ</div>';
    } else {
      const today = new Date();
      function dateBadge(d) {
        if (!d) return `<span class="date-chip date-none">-</span>`;
        const exp = new Date(d);
        if (isNaN(exp.getTime())) return `<span class="date-chip date-none">-</span>`;
        const diff = Math.ceil((exp - today) / 86400000);
        const cls = diff <= 0 ? 'date-urgent' : diff <= 7 ? 'date-urgent' : diff <= 30 ? 'date-warn' : 'date-ok';
        const display = exp.toLocaleDateString('th-TH', { day:'2-digit', month:'2-digit', year:'numeric' });
        return `<span class="date-chip ${cls}">${display}</span>`;
      }
      function isExpiredSoon(d) {
        if (!d) return false;
        const exp = new Date(d);
        if (isNaN(exp.getTime())) return false;
        const diff = Math.ceil((exp - today) / 86400000);
        return diff <= 30;
      }
      // สร้างรายการรถไม่ซ้ำโดย plate+branch
      const uniqueVehicles = [];
      const seen = new Set();
      vehicles.forEach(v => {
        const key = (v.plate||'') + '|' + (v.branch||'');
        if (!seen.has(key)) { seen.add(key); uniqueVehicles.push(v); }
      });
      const vTypes = { 'รถยนต์':'🚗', 'รถกระบะ':'🛻', 'รถบรรทุก':'🚚', 'รถจักรยานยนต์':'🏍️', 'รถตู้':'🚐' };
      listEl.innerHTML = `
        <div id="veh-drawer-container"></div>
        <div class="veh-grid">
          ${uniqueVehicles.map((v, idx) => {
            const ico = vTypes[v.type] || '🚗';
            const hasExpired = isExpiredSoon(v.prbDate) || isExpiredSoon(v.insurDate) || isExpiredSoon(v.taxDate);
            return `<div class="veh-card${hasExpired?' veh-expired':''}" onclick="toggleVehDrawer(${idx})">
              <div class="veh-card-head">
                <span class="veh-card-ico">${ico}</span>
                <div>
                  <div class="veh-card-plate">${v.plate||'-'}</div>
                  <div class="veh-card-type">${v.type||'-'}</div>
                </div>
                ${hasExpired ? '<span class="veh-card-expired-badge" style="margin-left:auto">⚠️ ใกล้หมด</span>' : ''}
              </div>
              <div class="veh-card-body">
                <div class="veh-card-row">
                  <span class="veh-card-lbl">สาขา</span>
                  <span class="veh-card-branch">${v.branch||'-'}</span>
                </div>
                <div class="veh-card-row">
                  <span class="veh-card-lbl">พ.ร.บ.</span>
                  ${dateBadge(v.prbDate)}
                </div>
              </div>
            </div>`;
          }).join('')}
        </div>`;
      // เก็บข้อมูลรถสำหรับ drawer
      window._vehiclesList = uniqueVehicles;
      window._dateBadgeFn = dateBadge;
    }
  }

  // ── TAB 2: ประวัติน้ำมัน ──
  if (!rRes.ok) {
    fuelEl.innerHTML = `<p style="color:var(--red);padding:16px">${rRes.error}</p>`;
  } else {
    const fuel = (rRes.data||[])
      .filter(r => r.type === 'เบิกน้ำมัน')
      .sort((a,b) => (b.id||'').localeCompare(a.id||''))
      .slice(0, 50);
    if (!fuel.length) {
      fuelEl.innerHTML = '<div class="empty">ยังไม่มีประวัติเบิกน้ำมัน</div>';
    } else {
      const stTh = { pending:'รออนุมัติ', approved:'อนุมัติแล้ว', rejected:'ไม่อนุมัติ' };
      fuelEl.innerHTML = `
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr>
              <th>วันที่</th><th>ผู้เบิก</th><th>สาขา</th><th>รายละเอียด</th><th>จำนวน</th><th>สถานะ</th>
            </tr></thead>
            <tbody>
              ${fuel.map(r => `<tr>
                <td style="white-space:nowrap">${r.date||'-'}</td>
                <td>${r.requester||'-'}</td>
                <td style="color:var(--text2)">${r.branch||'-'}</td>
                <td style="font-size:12px;color:var(--text2);max-width:220px">${r.purpose||'-'}</td>
                <td style="font-weight:800;color:var(--g);white-space:nowrap">฿${Number(r.amount||0).toLocaleString('th-TH')}</td>
                <td><span class="badge badge-${r.status||'pending'}">${stTh[r.status]||r.status}</span></td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>`;
    }
  }
}

function formatTabs(tabs) {
  if (!tabs) return '-';
  const t = typeof tabs === 'string' ? tabs.split(',') : tabs;
  const map = { dashboard:'ภาพรวม', request:'ยื่นคำขอ', mylist:'รายการ', approve:'อนุมัติ', vehicles:'รถ', users:'ผู้ใช้' };
  return t.filter(x=>x).map(x=>map[x]||x).join(', ') || '-';
}

}

function buildTabChips() {
  const wrap = document.getElementById('cu-tabs-wrap');
  wrap.innerHTML = '';
  TAB_OPTIONS.forEach(t => {
    const chip = document.createElement('div');
    chip.className = 'tab-chip' + (_cuTabs.includes(t.id) ? ' on' : '');
    chip.textContent = t.label;
    chip.onclick = () => {
      if (_cuTabs.includes(t.id)) _cuTabs = _cuTabs.filter(x => x !== t.id);
      else _cuTabs.push(t.id);
      buildTabChips();
    };
    wrap.appendChild(chip);
  });
}

async function doCreateUser() {
  const name     = document.getElementById('cu-name').value.trim();
  const username = document.getElementById('cu-username').value.trim();
  const password = document.getElementById('cu-password').value;
  const branch   = document.getElementById('cu-branch').value;
  const role     = document.getElementById('cu-role').value;
  const errEl    = document.getElementById('cu-err');
  errEl.textContent = '';
  if (!name||!username||!password) { errEl.textContent = 'กรุณากรอกข้อมูลให้ครบ'; return; }
  btnLoading('cu-btn', '⏳ กำลังบันทึก...');
  pbShow();
  const tabs = role === 'admin'
    ? 'dashboard,request,mylist,approve,vehicles,users'
    : (_cuTabs.length ? _cuTabs.join(',') : 'dashboard,request,mylist');
  const res = await apiPost('createUser', { name, username, password, branch, role, tabs });
  pbDone();
  btnRestore('cu-btn');
  if (res.ok) { closeModal('ov-create-user'); loadUsers(); }
  else { errEl.textContent = res.error || 'เกิดข้อผิดพลาด'; }
}

// ── RESET PASSWORD ──
function openResetPw(id, name, isOwnPw) {
  _resetUserId = id;
  _resetIsOwnPw = !!isOwnPw;
  document.getElementById('reset-pw-name').textContent = `ผู้ใช้: ${name}`;
  document.getElementById('reset-pw-val').value = '';
  document.getElementById('reset-pw-err').textContent = '';
  document.getElementById('ov-reset-pw').classList.add('open');
}

async function doResetPw() {
  const newPassword = document.getElementById('reset-pw-val').value;
  const errEl = document.getElementById('reset-pw-err');
  errEl.textContent = '';
  if (!newPassword || newPassword.length < 4) { errEl.textContent = 'รหัสผ่านต้องมีอย่างน้อย 4 ตัว'; return; }
  btnLoading('reset-pw-btn', '⏳ กำลังรีเซ็ต...');
  pbShow();
  const res = await apiPost('resetPassword', { userId: _resetUserId, newPassword });
  pbDone();
  btnRestore('reset-pw-btn');
  if (res.ok) {
    closeModal('ov-reset-pw');
    if (_resetIsOwnPw) {
      alert('รีเซ็ตรหัสผ่านสำเร็จ กรุณา Login ใหม่ด้วยรหัสผ่านใหม่');
      doLogout();
    } else {
      alert('รีเซ็ตรหัสผ่านสำเร็จ');
    }
  } else { errEl.textContent = res.error || 'เกิดข้อผิดพลาด'; }
}

async function toggleUserStatus(userId, status) {
  if (!confirm(status==='inactive'?'ระงับผู้ใช้นี้?':'เปิดใช้งานผู้ใช้นี้?')) return;
  pbShow();
  const res = await apiPost('updateUserStatus', { userId, status });
  pbDone();
  if (res.ok) loadUsers();
  else alert(res.error || 'เกิดข้อผิดพลาด');
}

// ════ AUTO LOGIN ════
(function() {
  const token = localStorage.getItem('sst_token');
  const userData = localStorage.getItem('sst_user');
  if (token && userData) {
    try { CU = JSON.parse(userData); startApp(); }
    catch(_) { localStorage.clear(); }
  }
})();
</script>
