<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>S.S.T ระบบเบิกจ่าย</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Sarabun',sans-serif}
:root{--g:#5BA85A;--gl:#EAF5EA;--gm:#8DC98C;--gd:#3A7A39;--r:#D45050;--rl:#FDEAEA;--or:#E09A30;--orl:#FEF3E0;--bl:#1A3A8A;--bll:#E8F0FE;--pu:#6A3AAA;--pul:#F0E8FE;--tx:#1C3D1C;--tx2:#4A6E4A;--tx3:#7A9A7A;--bd:#C8DEC8;--bg:#F0F4F0;--wh:#fff;--sb:#E4F0E4}
body{background:var(--bg);min-height:100vh}

/* LOGIN */
.lw{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#E4F0E4,#F0F4F0)}
.lc{background:#fff;border-radius:20px;padding:36px 32px;width:360px;box-shadow:0 8px 32px rgba(91,168,90,.15);border:1.5px solid var(--bd)}
.llogo{text-align:center;margin-bottom:16px}
.llogo img{width:80px;height:80px;object-fit:contain}
.ltitle{font-size:22px;font-weight:800;color:var(--tx);text-align:center;margin-bottom:4px}
.lsub{font-size:13px;color:var(--tx2);text-align:center;margin-bottom:24px;font-weight:600}
.llbl{font-size:12px;color:var(--tx2);font-weight:700;margin-bottom:5px;display:block}
.lin{width:100%;padding:10px 14px;border:1.5px solid var(--bd);border-radius:10px;font-size:14px;color:var(--tx);font-family:'Sarabun',sans-serif;font-weight:600;margin-bottom:14px}
.lin:focus{outline:none;border-color:var(--g)}
.lbtn{width:100%;padding:12px;background:var(--g);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;font-family:'Sarabun',sans-serif}
.lbtn:hover{background:var(--gd)}
.lerr{color:var(--r);font-size:12px;text-align:center;margin-top:8px;min-height:18px;font-weight:700}

/* APP */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:215px;background:var(--sb);border-right:1.5px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0}
.slogo{padding:14px 12px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px}
.slogo img{width:44px;height:44px;object-fit:contain;flex-shrink:0}
.logo-name{font-size:14px;font-weight:800;color:var(--tx)}
.logo-sub{font-size:10px;color:var(--tx2);font-weight:600}
.nav{flex:1;padding:6px 5px;overflow-y:auto}
.ns{font-size:10px;font-weight:800;color:var(--tx3);padding:10px 8px 3px;text-transform:uppercase;letter-spacing:1px}
.ni{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;color:var(--tx2);margin-bottom:1px;transition:background .15s}
.ni:hover{background:rgba(91,168,90,.15)}
.ni.active{background:var(--g);color:#fff}
.nb{margin-left:auto;background:var(--r);color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;font-weight:800}
.su{padding:10px;border-top:1px solid var(--bd)}
.ucard{display:flex;align-items:center;gap:8px}
.uav{width:32px;height:32px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800;flex-shrink:0}
.uname{font-size:12px;font-weight:800;color:var(--tx)}
.ubr{font-size:10px;color:var(--tx2);font-weight:600}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{padding:0 20px;height:52px;border-bottom:1.5px solid var(--bd);display:flex;align-items:center;justify-content:space-between;background:#fff;flex-shrink:0}
.pt{font-size:16px;font-weight:800;color:var(--tx)}
.ps{font-size:11px;color:var(--tx2);font-weight:600}
.content{flex:1;overflow-y:auto;padding:16px 20px;background:var(--bg)}
.panel{display:none}.panel.active{display:block}

/* COMPONENTS */
.card{background:#fff;border:1.5px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ct{font-size:13px;font-weight:800;color:var(--tx)}
.btn{padding:7px 14px;border-radius:8px;font-size:12px;cursor:pointer;border:1.5px solid var(--bd);background:#fff;color:var(--tx2);font-weight:700;display:inline-flex;align-items:center;gap:5px;transition:opacity .15s}
.btn:hover{opacity:.85}
.btnp{background:var(--g);color:#fff;border-color:var(--g)}
.btns{border-color:var(--gm);color:var(--gd)}
.btnb{background:var(--bl);color:#fff;border-color:var(--bl)}
.btnr{background:var(--r);color:#fff;border-color:var(--r)}
.btnor{background:var(--or);color:#fff;border-color:var(--or)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.badge{display:inline-flex;padding:3px 8px;border-radius:14px;font-size:11px;font-weight:700}
.bw{background:var(--orl);color:#8A6000}.bok{background:#E8F5E8;color:#2A6A2A}.bno{background:var(--rl);color:#8A2020}.brec{background:var(--bll);color:var(--bl)}.bauto{background:var(--pul);color:var(--pu)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;padding:6px 8px;color:var(--tx2);border-bottom:1.5px solid var(--bd);font-weight:800;font-size:11px;text-transform:uppercase}
.tbl td{padding:8px;border-bottom:1px solid var(--gl);color:var(--tx);font-weight:600}
.tbl tr:hover td{background:#f5fbf5}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgr{display:flex;flex-direction:column;gap:4px}
.fgr.full{grid-column:1/-1}
.flbl{font-size:11px;color:var(--tx2);font-weight:800}
.flbl .req{color:var(--r)}
.fin{padding:8px 10px;border:1.5px solid var(--bd);border-radius:8px;font-size:13px;color:var(--tx);background:#fff;width:100%;font-family:'Sarabun',sans-serif;font-weight:600}
.fin:focus{outline:none;border-color:var(--g)}
.ubox{border:2px dashed var(--gm);border-radius:10px;padding:14px;text-align:center;background:var(--gl);cursor:pointer}
.ubox:hover{background:#dff0df}
.sig-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.sig-box{border:1.5px solid var(--bd);border-radius:8px;padding:8px 10px;background:var(--gl)}
.sig-lbl{font-size:10px;color:var(--tx3);font-weight:700;margin-bottom:3px}
.sig-name{font-size:12px;font-weight:800;color:var(--tx);border-bottom:1px solid var(--bd);padding-bottom:3px}
.sig-date{font-size:10px;color:var(--tx2);margin-top:2px;font-weight:600}
.hint{font-size:11px;color:var(--tx3);margin-top:8px;padding:7px 10px;background:var(--gl);border-radius:8px;display:flex;align-items:center;gap:5px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.sc{background:#fff;border:1.5px solid var(--bd);border-radius:12px;padding:12px 14px;position:relative;overflow:hidden}
.sc::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%}
.sc.wait::before{background:var(--or)}.sc.ok::before{background:var(--g)}.sc.no::before{background:var(--r)}.sc.total::before{background:var(--tx)}
.slbl{font-size:11px;color:var(--tx2);margin-bottom:3px;font-weight:700}
.sval{font-size:22px;font-weight:800;color:var(--tx)}
.sval.o{color:var(--or)}.sval.g{color:var(--g)}.sval.r{color:var(--r)}
.borrow-tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.btab{padding:8px 16px;border-radius:8px;font-size:12px;cursor:pointer;border:1.5px solid var(--bd);background:#fff;color:var(--tx2);font-weight:700}
.btab.active{background:var(--g);color:#fff;border-color:var(--g)}
.step-indicator{display:flex;align-items:center;gap:0;margin-bottom:16px}
.step-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;border:2px solid var(--bd);background:#fff;color:var(--tx3)}
.step-dot.active{background:var(--g);color:#fff;border-color:var(--g)}
.step-dot.done{background:var(--gm);color:#fff;border-color:var(--gm)}
.step-line{flex:1;height:2px;background:var(--bd)}
.step-line.done{background:var(--gm)}
.step-label{font-size:10px;color:var(--tx3);font-weight:700;margin-top:4px;text-align:center;width:28px}
.items-tbl{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:6px}
.items-tbl th{padding:6px 7px;background:var(--gl);color:var(--tx2);font-size:11px;font-weight:800;text-align:left;border-bottom:1px solid var(--bd)}
.items-tbl td{padding:5px 4px;border-bottom:1px solid var(--gl)}
.items-tbl td input,.items-tbl td select{border:1px solid var(--bd);border-radius:5px;padding:5px 6px;font-size:12px;width:100%;font-family:'Sarabun',sans-serif;font-weight:600}
.add-row-btn{color:var(--g);font-size:12px;cursor:pointer;font-weight:800;padding:5px 7px;display:inline-flex;align-items:center;gap:4px}
.veh-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.veh-card{background:#fff;border:1.5px solid var(--bd);border-radius:12px;padding:12px;cursor:pointer;text-align:center;position:relative;transition:border-color .15s}
.veh-card:hover{border-color:var(--g)}
.veh-card.selected{border-color:var(--g);border-width:2.5px;background:var(--gl)}
.veh-icon{font-size:30px;margin-bottom:6px;display:block}
.veh-plate{font-size:13px;font-weight:800;color:var(--tx);background:#FFF8E6;border:1px solid var(--or);border-radius:5px;padding:2px 8px;display:inline-block;margin-bottom:3px}
.veh-type{font-size:10px;color:var(--tx2);font-weight:600}
.veh-alert{position:absolute;top:6px;right:6px;width:18px;height:18px;background:var(--r);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:800}
.exp-cat{background:#fff;border:1.5px solid var(--bd);border-radius:10px;margin-bottom:8px;overflow:hidden}
.exp-cat-head{padding:10px 12px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;background:var(--gl)}
.exp-cat-head:hover{background:#dff0df}
.exp-cat-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--tx)}
.exp-cat-ico{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px}
.exp-cat-total{font-size:13px;font-weight:800;color:var(--gd)}
.auto-tag{font-size:9px;background:var(--pul);color:var(--pu);padding:2px 6px;border-radius:7px;font-weight:700}
.manual-tag{font-size:9px;background:var(--bll);color:var(--bl);padding:2px 6px;border-radius:7px;font-weight:700}
.exp-cat-body{padding:0 12px 10px}
.filter-bar{background:#fff;border:1.5px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:12px;display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.filter-lbl{font-size:11px;color:var(--tx2);font-weight:800;margin-bottom:3px}
.acard{background:#fff;border:1.5px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.acard-top{display:flex;gap:10px;align-items:flex-start}
.aico{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.aico.m{background:var(--gl)}.aico.f{background:var(--bll)}.aico.b{background:var(--orl)}.aico.rx{background:var(--rl)}
.ameta{flex:1}
.aname{font-size:13px;font-weight:800;color:var(--tx)}
.adet{font-size:11px;color:var(--tx2);margin-top:2px;font-weight:600;line-height:1.5}
.aamt{font-size:15px;font-weight:800;color:var(--tx);text-align:right;white-space:nowrap}
.aact{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--gl);align-items:center}
.abtn-ok{padding:6px 14px;border-radius:8px;font-size:12px;border:none;background:var(--g);color:#fff;cursor:pointer;font-weight:800}
.abtn-no{padding:6px 14px;border-radius:8px;font-size:12px;border:1.5px solid var(--r);background:var(--rl);color:var(--r);cursor:pointer;font-weight:700}
.tab-row{display:flex;gap:4px;margin-bottom:12px}
.tab{padding:6px 14px;border-radius:8px;font-size:12px;cursor:pointer;border:1.5px solid var(--bd);background:#fff;color:var(--tx2);font-weight:700}
.tab.active{background:var(--g);color:#fff;border-color:var(--g)}
.rp{background:#fff;border:1.5px solid var(--bd);border-radius:10px;padding:14px}
.rp-head{text-align:center;border-bottom:1.5px solid var(--bd);padding-bottom:10px;margin-bottom:10px}
.loading-el{text-align:center;padding:30px;color:var(--tx2);font-size:13px;font-weight:600}
.empty-el{text-align:center;padding:24px;color:var(--tx3);font-size:12px;font-weight:600}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center}
.modal-box{background:#fff;border-radius:16px;padding:24px;width:400px;max-width:90vw;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.modal-title{font-size:15px;font-weight:800;color:var(--tx);margin-bottom:14px}

/* STEP 2 NOTICE */
.step2-notice{background:var(--bll);border:1.5px solid #A8C0F0;border-radius:10px;padding:12px 14px;margin-bottom:10px}
.step2-notice .title{font-size:13px;font-weight:800;color:var(--bl);margin-bottom:4px}
.step2-notice .sub{font-size:12px;color:var(--bl);font-weight:600}

/* DOC PREVIEW */
.doc-box{background:#fff;border:2px solid #333;border-radius:4px;padding:20px;position:relative;font-size:12px}
.doc-watermark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-30deg);font-size:40px;color:rgba(91,168,90,.06);font-weight:900;white-space:nowrap;pointer-events:none}
.doc-hd{text-align:center;border-bottom:2px solid #333;padding-bottom:10px;margin-bottom:12px}
.doc-title{font-size:14px;font-weight:800;letter-spacing:1px}
.doc-row{display:flex;gap:8px;margin-bottom:7px}
.doc-lbl{width:140px;font-weight:800;color:#333;flex-shrink:0}
.doc-val{flex:1;border-bottom:1px solid #999;padding-bottom:2px;min-height:18px;font-weight:600}
.doc-purpose-box{border:1px solid #333;border-radius:4px;padding:8px;min-height:50px;margin:8px 0;line-height:1.6;font-weight:600}
.doc-sig{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.doc-sig-box{text-align:center}
.doc-sig-line{border-top:1px solid #333;margin-top:28px;padding-top:4px;font-size:10px;color:#555;font-weight:600}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-page" class="lw">
  <div class="lc">
    <div class="llogo"><img src="logo.png" alt="S.S.T Logo" onerror="this.style.display='none'"/></div>
    <div class="ltitle">ศรีสุธา</div>
    <div class="lsub">ระบบเบิกจ่ายและอนุมัติค่าใช้จ่าย</div>
    <label class="llbl">ชื่อผู้ใช้</label>
    <input class="lin" id="inp-user" placeholder="username" onkeydown="if(event.key==='Enter'){event.preventDefault();el('inp-pass').focus();}"/>
    <label class="llbl">รหัสผ่าน</label>
    <input class="lin" id="inp-pass" type="password" placeholder="password" onkeydown="if(event.key==='Enter'){event.preventDefault();doLogin();}"/>
    <button class="lbtn" id="login-btn" onclick="doLogin()">เข้าสู่ระบบ</button>
    <div class="lerr" id="login-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app-page" class="app" style="display:none">
  <div class="sidebar">
    <div class="slogo">
      <img src="logo.png" alt="S.S.T" onerror="this.style.display='none'"/>
      <div><div class="logo-name">ศรีสุธา</div><div class="logo-sub">ระบบเบิกจ่าย</div></div>
    </div>
    <div class="nav" id="sidebar-nav"></div>
    <div class="su">
      <div class="ucard">
        <div class="uav" id="u-av">?</div>
        <div><div class="uname" id="u-name">-</div><div class="ubr" id="u-br">-</div></div>
        <span onclick="doLogout()" style="margin-left:auto;cursor:pointer;font-size:18px;color:var(--tx3)" title="ออกจากระบบ">⇥</span>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div><div class="pt" id="page-title">ภาพรวม</div><div class="ps" id="page-sub"></div></div>
      <div style="display:flex;gap:8px" id="topbar-btns"></div>
    </div>
    <div class="content" id="main-content">
      <div class="loading-el">⏳ กำลังโหลด...</div>
    </div>
  </div>
</div>

<script src="api.js"></script>
<script>
// =========================================
// HELPERS
// =========================================
const MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const MONTHS_S = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function thaiNow() {
  const d = new Date();
  return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()+543}`;
}
function toThai(str) {
  if (!str) return '-';
  const d = new Date(str);
  if (isNaN(d)) return str;
  return `${d.getDate()} ${MONTHS_S[d.getMonth()]} ${d.getFullYear()+543}`;
}
function statusBadge(s) {
  const m = { pending:'<span class="badge bw">รอพิจารณา</span>', approved:'<span class="badge bok">อนุมัติ</span>', rejected:'<span class="badge bno">ไม่อนุมัติ</span>' };
  return m[s] || `<span class="badge">${s}</span>`;
}
function el(id) { return document.getElementById(id); }
function val(id) { return el(id)?.value || ''; }
function setHTML(id, html) { const e = el(id); if (e) e.innerHTML = html; }
function loading(id) { setHTML(id, '<div class="loading-el">⏳ กำลังโหลด...</div>'); }
function empty(id, msg = 'ไม่พบข้อมูล') { setHTML(id, `<div class="empty-el">${msg}</div>`); }

// =========================================
// AUTH
// =========================================
async function doLogin() {
  const user = val('inp-user').trim();
  const pass = val('inp-pass');
  const errEl = el('login-err');
  const btn = el('login-btn');
  errEl.textContent = '';
  if (!user || !pass) { errEl.textContent = 'กรุณากรอกชื่อผู้ใช้และรหัสผ่าน'; return; }
  btn.disabled = true; btn.textContent = 'กำลังเข้าสู่ระบบ...';
  try {
    const u = await login(user, pass);
    initApp(u);
  } catch(e) {
    errEl.textContent = e.message;
    btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
  }
}

function doLogout() { if (confirm('ต้องการออกจากระบบ?')) logout(); }

// =========================================
// NAV
// =========================================
const NAV = [
  { s:'หลัก' },
  { id:'dashboard', label:'📊 ภาพรวม', tab:'dashboard' },
  { s:'ดำเนินการ' },
  { id:'request', label:'📋 ขอเบิก', tab:'request' },
  { id:'ledger', label:'📒 บันทึกรายจ่าย', tab:'ledger' },
  { s:'ติดตาม' },
  { id:'mylist', label:'📝 รายการของฉัน', tab:'mylist' },
  { id:'photos', label:'🖼️ หลักฐานรูปภาพ', tab:'photos' },
  { s:'ระบบรถ' },
  { id:'vehicles', label:'🚗 ข้อมูลรถ', tab:'vehicles', badge:'alert' },
  { id:'calendar', label:'🔔 แจ้งเตือน/ปฏิทิน', tab:'calendar' },
  { s:'Admin', admin:true },
  { id:'approve', label:'✅ อนุมัติรายการ', tab:'approve', badge:'pending', admin:true },
  { id:'report', label:'🖨️ รายงาน', tab:'report', admin:true },
  { id:'users', label:'👥 จัดการผู้ใช้', tab:'users', admin:true },
];

let curPanel = 'dashboard';

function initApp(user) {
  el('login-page').style.display = 'none';
  el('app-page').style.display = 'flex';
  el('u-name').textContent = user.name;
  el('u-br').textContent = `${user.branch} · ${user.role === 'admin' ? 'Admin' : 'พนักงาน'}`;
  el('u-av').textContent = user.name.charAt(0);
  buildNav(user);
  showPanel('dashboard');
  startPolling(() => refreshPanel());
  loadQueue();
  if (isAdmin()) loadPendingBadge();
  loadAlertBadge();
}

function buildNav(user) {
  const nav = el('sidebar-nav');
  nav.innerHTML = '';
  NAV.forEach(item => {
    if (item.admin && user.role !== 'admin') return;
    if (item.s) { nav.innerHTML += `<div class="ns">${item.s}</div>`; return; }
    if (!hasTab(item.tab)) return;
    nav.innerHTML += `<div class="ni" id="nav-${item.id}" onclick="showPanel('${item.id}')">${item.label}${item.badge ? `<span class="nb" id="badge-${item.badge}" style="display:none">0</span>` : ''}</div>`;
  });
}

async function loadPendingBadge() {
  try {
    const r = await apiGet('getRequests', { status: 'pending' });
    const n = r?.data?.length || 0;
    const e = el('badge-pending');
    if (e) { e.textContent = n; e.style.display = n > 0 ? '' : 'none'; }
  } catch(_) {}
}

async function loadAlertBadge() {
  try {
    const r = await apiGet('getAlerts');
    const n = r?.data?.length || 0;
    const e = el('badge-alert');
    if (e) { e.textContent = n; e.style.display = n > 0 ? '' : 'none'; }

}

async function renderDashboard() {
  loading('main-content');
  try {
    const [rq, al] = await Promise.all([apiGet('getRequests', {}), apiGet('getAlerts')]);
    const reqs = rq?.data || [];
    const pending = reqs.filter(r => r.status === 'pending').length;
    const approved = reqs.filter(r => r.status === 'approved').length;
    const rejected = reqs.filter(r => r.status === 'rejected').length;
    const total = reqs.filter(r => r.status === 'approved').reduce((s, r) => s + (+r.amount || 0), 0);
    const alerts = al?.data || [];
    const alertBanner = alerts.length ? `
      <div onclick="showPanel('calendar')" style="background:var(--rl);border:1.5px solid var(--r);border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;cursor:pointer">
        <span style="font-size:22px">🚗</span>
        <div style="flex:1"><div style="font-size:13px;font-weight:800;color:#8A2020">แจ้งเตือน: มีเอกสารรถใกล้หมดอายุ ${alerts.length} รายการ</div>
        <div style="font-size:11px;color:#A03030;font-weight:600">คลิกเพื่อดูรายละเอียด</div></div>
        <span style="color:var(--r);font-size:20px">›</span>
      </div>` : '';
    const rows = reqs.slice(-5).reverse().map(r => `
      <tr><td>${r.date||'-'}</td><td><span class="badge bw" style="font-size:10px">${r.type||'-'}</span></td>
      <td>${r.purpose||'-'}</td><td>${r.amount?'฿'+Number(r.amount).toLocaleString():'—'}</td>
      <td>${statusBadge(r.status)}</td></tr>`).join('') || `<tr><td colspan="5" class="empty-el">ยังไม่มีรายการ</td></tr>`;
    setHTML('main-content', `
      ${alertBanner}
      <div class="stats">
        <div class="sc wait"><div class="slbl">รอดำเนินการ</div><div class="sval o">${pending}</div></div>
        <div class="sc ok"><div class="slbl">อนุมัติแล้ว</div><div class="sval g">${approved}</div></div>
        <div class="sc no"><div class="slbl">ไม่อนุมัติ</div><div class="sval r">${rejected}</div></div>
        <div class="sc total"><div class="slbl">ยอดรวมที่อนุมัติ</div><div class="sval" style="font-size:16px">฿${total.toLocaleString()}</div></div>
      </div>
      <div class="card">
        <div class="ch"><span class="ct">รายการล่าสุด</span><span style="color:var(--g);cursor:pointer;font-size:12px;font-weight:700" onclick="showPanel('mylist')">ดูทั้งหมด →</span></div>
        <table class="tbl"><tr><th>วันที่</th><th>ประเภท</th><th>รายละเอียด</th><th>จำนวน</th><th>สถานะ</th></tr>${rows}</table>
      </div>`);
  } catch(e) { setHTML('main-content', `<div class="empty-el">❌ ${e.message}</div>`); }
}

async function submitMoney() {
  const purpose = val('m-purpose');
  const amount = val('m-amount');

  const user = getUser();
  const btn = el('m-submit-btn');
  btn.disabled = true; btn.textContent = 'กำลังส่ง...';
  let imageUrls = '';
  const files = el('m-files')?.files;
  if (files?.length) {
    const urls = await uploadImages(Array.from(files), 'เบิกเงิน', user.branch);
    imageUrls = urls.join(',');

  enqueue('submitRequest', {
    type: 'เบิกเงิน', amount, purpose,
    requester: val('m-requester') || user.name,
    receiver, branch: val('m-branch') || user.branch,
    noReceipt: noRcpt, noReceiptReason: val('m-nr-reason'), imageUrls,
  }, () => { showPanel('mylist'); }, () => { btn.disabled = false; btn.textContent = '📤 ส่งขอเบิก'; });
}

function addRow(tableId) {
  const tbl = document.getElementById(tableId);
  const n = tbl.querySelectorAll('tr').length;
  const tr = document.createElement('tr');
  tr.innerHTML = `<td style="text-align:center;color:var(--tx3)">${n}</td><td><input placeholder="ชื่อ"/></td><td><input placeholder="หน่วย" style="width:60px"/></td><td><input type="number" placeholder="1" style="width:50px"/></td><td><input placeholder=""/></td>`;
  tbl.appendChild(tr);
}

function getRows(tableId) {
  const rows = document.querySelectorAll(`#${tableId} tr`);
  const items = [];
  rows.forEach((r, i) => {
    if (i === 0) return;
    const inp = r.querySelectorAll('input');
    if (inp[0]?.value) items.push({ name: inp[0].value, unit: inp[1]?.value, qty: inp[2]?.value, note: inp[3]?.value });
  });
  return items;
}

  btn.disabled = true; btn.textContent = 'กำลังส่ง...';
  enqueue('submitRequest', {
    type: 'เบิกซื้อของ', step: '1',

function selVeh(el, plate) {

async function submitFuel() {
  const user = getUser();
  const btn = el('fuel-btn');
  const fActive = el('ff-f')?.style.display !== 'none';
  const rActive = el('ff-r')?.style.display !== 'none';
  let type, amount, purpose, filesEl, prevEl, requester, receiver;
  if (fActive) { type='ค่าน้ำมัน'; amount=val('fu-amount'); purpose=val('fu-detail')||'เติมน้ำมัน'; filesEl='fu-files'; prevEl='fu-prev'; requester=val('fu-requester'); receiver=val('fu-receiver'); }
  else if (rActive) { type='ซ่อมรถ'; amount=val('re-amount'); purpose=val('re-detail')||'ซ่อมรถ'; filesEl='re-files'; prevEl='re-prev'; requester=val('re-requester'); receiver=val('re-receiver'); }
  else { type='ค่าทางด่วน'; amount=val('tl-amount'); purpose=val('tl-route')||'ค่าทางด่วน'; filesEl='tl-files'; prevEl='tl-prev'; requester=val('tl-requester'); receiver=val('tl-receiver'); }
  if (!amount) { showToast('กรุณากรอกจำนวนเงิน', 'error'); return; }
  btn.disabled = true; btn.textContent = 'กำลังส่ง...';
  let imageUrls = '';
  const files = el(filesEl)?.files;
  if (files?.length) {
    const urls = await uploadImages(Array.from(files), type, user.branch);
    imageUrls = urls.join(',');
  }
  enqueue('submitRequest', { type, amount, purpose, vehiclePlate: selPlate, branch: user?.branch, requester: requester || user?.name, receiver: receiver || user?.name, imageUrls },
    () => { showPanel('mylist'); },
    () => { btn.disabled = false; btn.textContent = '📤 ส่งขอเบิก'; });
}

function previewFiles(inputId, previewId) {
  const files = el(inputId)?.files;
  const prev = el(previewId);
  if (!prev) return;
  prev.innerHTML = Array.from(files||[]).map(f => `<div style="background:var(--gl);border:1px solid var(--bd);border-radius:6px;padding:4px 8px;font-size:11px;color:var(--tx2);font-weight:600">📎 ${f.name}</div>`).join('');
}

async function loadLedger() {
  const branch = val('led-branch') || 'all';
  const type = val('led-type') || 'all';
  loading('ledger-data');
  try {
    const r = await apiGet('getLedger', { branch, type });
    const data = r?.data || [];
    if (!data.length) { empty('ledger-data', '📭 ไม่พบรายการ'); return; }
    const groups = {};
    data.forEach(i => { const t = i.type||'อื่นๆ'; if (!groups[t]) groups[t] = []; groups[t].push(i); });
    const icons = { 'เบิกเงิน':'💵','เบิกซื้อของ':'🛒','เบิกของ':'📦','ค่าน้ำมัน':'⛽','ซ่อมรถ':'🔧','ค่าทางด่วน':'🛣️','รายจ่ายทั่วไป':'📋' };
    let html = '';
    Object.entries(groups).forEach(([t, items]) => {
      const total = items.reduce((s, i) => s + (+i.amount||0), 0);
      const rows = items.map(i => `<tr>
        <td>${i.date||'-'}</td><td>${i.name||'-'}</td><td>${i.branch||'-'}</td>
        <td>${i.purpose||'-'}</td><td>${i.vehiclePlate||'-'}</td>
        <td style="font-weight:800">฿${(+i.amount||0).toLocaleString()}</td>
        <td><span class="badge ${i.source==='auto'?'bauto':'brec'}">${i.source==='auto'?'อัตโนมัติ':'กรอกเอง'}</span></td>
      </tr>`).join('');
      html += `<div class="exp-cat">
        <div class="exp-cat-head" onclick="toggleSection(this)">
          <div class="exp-cat-title"><div class="exp-cat-ico">${icons[t]||'📋'}</div>${t}
            <span class="${items[0]?.source==='auto'?'auto-tag':'manual-tag'}">${items[0]?.source==='auto'?'อัตโนมัติ':'กรอกเอง'}</span>
          </div>
          <div class="exp-cat-total">฿${total.toLocaleString()}</div>
        </div>
        <div class="exp-cat-body" style="display:none">
          <table class="tbl" style="margin-top:6px">
            <tr><th>วันที่</th><th>ชื่อ</th><th>สาขา</th><th>รายละเอียด</th><th>ทะเบียน</th><th>จำนวน</th><th>ที่มา</th></tr>
            ${rows}
          </table>
        </div>
      </div>`;
    });
    const grand = data.reduce((s,i) => s+(+i.amount||0), 0);
    html += `<div style="background:#fff;border:1.5px solid var(--bd);border-radius:9px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:12px;color:var(--tx2);font-weight:700">ยอดรวมทั้งหมด</span>
      <span style="font-size:18px;font-weight:800;color:var(--gd)">฿${grand.toLocaleString()}</span>
    </div>`;
    setHTML('ledger-data', html);
  } catch(e) { setHTML('ledger-data', `<div class="empty-el">❌ ${e.message}</div>`); }
}

function toggleSection(head) {
  const body = head.nextElementSibling;
  if (body) body.style.display = body.style.display === 'none' ? '' : 'none';
}

async function submitStep2(requestId) {
  const amount = val('s2-amount');
  if (!amount) { showToast('กรุณากรอกราคารวม', 'error'); return; }
  const user = getUser();
  const btn = el('s2-btn');
  btn.disabled = true; btn.textContent = 'กำลังส่ง...';
  let imageUrls = '';
  const files = el('s2-files')?.files;
  if (files?.length) {
    const urls = await uploadImages(Array.from(files), 'เบิกซื้อของ-step2', user.branch);
    imageUrls = urls.join(',');
  }
  enqueue('submitRequest', {
    type: 'เบิกซื้อของ', step: '2',
    amount, purpose: val('s2-shop') || 'ใบเสนอราคา',
    noReceipt: el('s2-noquote')?.checked,

    imageUrls, parentId: requestId,
    branch: user?.branch,
  }, () => { el('step2-area').innerHTML = ''; showPanel('mylist'); },

}

async function loadVehList() {
  try {
    const r = await apiGet('getVehicles');
    const data = r?.data || [];
    if (!data.length) { empty('veh-list', '🚗 ยังไม่มีรถในระบบ'); return; }
    const today = new Date();
    setHTML('veh-list', data.map(v => {
      function dd(s) { if (!s) return null; const d = new Date(s); return Math.ceil((d-today)/86400000); }
      function cls(n) { return n===null?'ok':n<=7?'danger':n<=10?'warn':'ok'; }
      function txt(n) { return n===null?'—':n<0?'⛔ หมดแล้ว':n<=7?`⚠ อีก ${n} วัน!`:n<=10?`⚠ อีก ${n} วัน`:`อีก ${n} วัน`; }
      function col(n) { return n===null?'var(--gd)':n<=7?'var(--r)':n<=10?'var(--or)':'var(--gd)'; }
      const p=dd(v.prbDate), ins=dd(v.insurDate), tax=dd(v.taxDate);
      return `<div class="veh-detail-card">
        <div style="background:var(--gl);padding:12px 14px;display:flex;align-items:center;gap:12px">
          <div style="font-size:38px">${v.type?.includes('ตู้')?'🚌':'🚗'}</div>
          <div>
            <div class="veh-plate" style="font-size:15px">${v.plate}</div>
            <div style="font-size:11px;color:var(--tx2);margin-top:3px;font-weight:600">${v.type||''} · ${v.branch||''}</div>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 14px">
          <div class="exp-item ${cls(p)}"><div class="exp-label">พ.ร.บ.</div><div class="exp-date">${toThai(v.prbDate)}</div><div class="exp-days" style="color:${col(p)}">${txt(p)}</div></div>
          <div class="exp-item ${cls(ins)}"><div class="exp-label">ประกันภัย</div><div class="exp-date">${toThai(v.insurDate)}</div><div class="exp-days" style="color:${col(ins)}">${txt(ins)}</div></div>
          <div class="exp-item ${cls(tax)}"><div class="exp-label">ภาษีประจำปี</div><div class="exp-date">${toThai(v.taxDate)}</div><div class="exp-days" style="color:${col(tax)}">${txt(tax)}</div></div>
        </div>
      </div>`;
    }).join(''));
  } catch(e) { setHTML('veh-list', `<div class="empty-el">❌ ${e.message}</div>`); }
}

async function renderCalendar() {
  loading('main-content');
  try {
    const r = await apiGet('getAlerts', {}, true);
    const alerts = r?.data || [];
    const now = new Date();
    const dim = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
    const fd = new Date(now.getFullYear(), now.getMonth(), 1).getDay();
    const adays = {};
    alerts.forEach(a => { const d = new Date(a.expDate); if (d.getMonth()===now.getMonth()) adays[d.getDate()]=a.level; });
    let cells = ['อา','จ','อ','พ','พฤ','ศ','ส'].map(d=>`<div style="text-align:center;font-size:10px;font-weight:700;color:var(--tx2);padding:3px 0">${d}</div>`).join('');
    for (let i=0;i<fd;i++) cells += '<div></div>';
    for (let d=1;d<=dim;d++) {
      const t = d===now.getDate(); const lv = adays[d];
      cells += `<div style="text-align:center;padding:4px 2px;border-radius:5px;font-size:11px;font-weight:${t?'800':'600'};background:${t?'var(--g)':'transparent'};color:${t?'#fff':lv?'var(--r)':'var(--tx2)'};cursor:pointer;min-height:28px">
        ${d}${lv?`<div style="width:5px;height:5px;border-radius:50%;background:${lv==='urgent'?'var(--r)':'var(--or)'};margin:2px auto 0"></div>`:''}
      </div>`;
    }
    const cards = alerts.length ? alerts.map(a => `
      <div class="alert-card">
        <div class="alert-ico ${a.level}">${a.level==='urgent'?'⚠️':'🗓️'}</div>
        <div class="ameta">
          <div class="aname">${a.field==='prbDate'?'พ.ร.บ.':a.field==='insurDate'?'ประกันภัย':'ภาษีประจำปี'} · ${a.plate}</div>
          <div class="adet">หมดอายุ ${toThai(a.expDate)} · สาขา ${a.branch}</div>
          <span class="badge ${a.level==='urgent'?'bno':'bw'}" style="margin-top:4px">${a.level==='urgent'?'🔴':'🟠'} อีก ${a.daysLeft} วัน</span>
        </div>
        <button class="btn btnp" style="font-size:10px;align-self:flex-start" onclick="showDoneAlert('${a.vehicleId}','${a.field}','${a.plate}')">✅ ดำเนินการแล้ว</button>
      </div>`) .join('') : '<div class="empty-el">✅ ไม่มีการแจ้งเตือน</div>';

    setHTML('main-content', `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div class="card">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
            <span style="font-size:13px;font-weight:800;color:var(--tx)">${MONTHS[now.getMonth()]} ${now.getFullYear()+543}</span>
          </div>
          <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:8px">${cells}</div>
          <div style="display:flex;gap:10px;font-size:10px;color:var(--tx2);padding-top:6px;border-top:1px solid var(--gl);font-weight:600">
            <span>🔴 เร่งด่วน</span><span>🟠 ใกล้ถึง</span><span>🟢 วันนี้</span>
          </div>
        </div>
        <div>
          <div style="font-size:13px;font-weight:800;color:var(--tx);margin-bottom:8px">รายการแจ้งเตือน</div>
          ${cards}
        </div>
      </div>
      <div id="done-alert-area" style="margin-top:12px"></div>`);
  } catch(e) { setHTML('main-content', `<div class="empty-el">❌ ${e.message}</div>`); }
}

            </div>
            <div style="text-align:right;flex-shrink:0">
              <div style="font-size:15px;font-weight:800;color:var(--tx)">${item.amount?'฿'+Number(item.amount).toLocaleString():'—'}</div>
              <span class="badge bw">รอพิจารณา</span>
            </div>
          </div>
          <div class="aact">
            <button class="abtn-ok" id="ok-${item.id}" onclick="doApprove('${item.id}')">✓ อนุมัติ</button>
            <button class="abtn-no" id="no-${item.id}" onclick="showRejectModal('${item.id}','${item.requester||item.name||''}')">✕ ไม่อนุมัติ</button>
            <span style="font-size:11px;color:var(--tx3);font-weight:600;margin-left:auto">ID: ${item.id}</span>
          </div>
        </div>`;
    }).join('') : '<div class="empty-el">✅ ไม่มีรายการรออนุมัติ</div>';

    setHTML('main-content', `
      <div style="background:var(--pul);border:1.5px solid #C8A8F0;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:12px;color:var(--pu);display:flex;align-items:center;gap:7px;font-weight:700">
        ✨ อนุมัติแล้ว → บันทึกรายจ่ายอัตโนมัติทันที
      </div>
      <div id="reject-modal-area"></div>
      ${cards}`);
  } catch(e) { setHTML('main-content', `<div class="empty-el">❌ ${e.message}</div>`); }
}

async function doApprove(id) {
  const okBtn = el(`ok-${id}`);
  const noBtn = el(`no-${id}`);
  if (okBtn) { okBtn.disabled = true; okBtn.textContent = '⏳ กำลังอนุมัติ...'; }
  if (noBtn) noBtn.disabled = true;
  try {
    await apiPost('approveRequest', { id });
    showToast('✓ อนุมัติสำเร็จ', 'success');
    const card = el(`acard-${id}`);
    if (card) {
      card.style.opacity = '0.5';
      card.querySelector('.aact').innerHTML = '<span class="badge bok">✓ อนุมัติแล้ว</span>';
    }
    loadPendingBadge();
  } catch(e) {
    showToast('❌ ' + e.message, 'error');
    if (okBtn) { okBtn.disabled = false; okBtn.textContent = '✓ อนุมัติ'; }
    if (noBtn) noBtn.disabled = false;
  }
}

function showRejectModal(id, name) {
  el('reject-modal-area').innerHTML = `
    <div class="card" style="border:2px solid var(--r);margin-bottom:12px">
      <div style="font-size:13px;font-weight:800;color:var(--r);margin-bottom:10px">✕ ไม่อนุมัติ — ${name}</div>
      <div class="fgr">
        <div class="flbl">เหตุผลที่ไม่อนุมัติ <span class="req">*</span></div>
        <textarea class="fin" id="reject-reason" rows="3" placeholder="ระบุเหตุผลที่ไม่อนุมัติ..."></textarea>
      </div>
      <div style="margin-top:10px;display:flex;gap:8px;justify-content:flex-end">
        <button class="btn" onclick="el('reject-modal-area').innerHTML=''">ยกเลิก</button>
        <button class="btn btnr" id="rej-btn" onclick="doReject('${id}')">✕ ยืนยันไม่อนุมัติ</button>
      </div>
    </div>`;
  el('reject-modal-area').scrollIntoView({ behavior: 'smooth' });
}

async function doReject(id) {
  const reason = val('reject-reason').trim();
  if (!reason) { showToast('กรุณาระบุเหตุผล', 'error'); return; }
  const btn = el('rej-btn');
  btn.disabled = true; btn.textContent = '⏳ กำลังบันทึก...';
  try {
    await apiPost('rejectRequest', { id, reason });
    showToast('บันทึกการไม่อนุมัติแล้ว', 'success');
    el('reject-modal-area').innerHTML = '';
    const card = el(`acard-${id}`);
    if (card) {
      card.style.opacity = '0.5';
      card.querySelector('.aact').innerHTML = '<span class="badge bno">✕ ไม่อนุมัติแล้ว</span>';
    }
    loadPendingBadge();
  } catch(e) {
    showToast('❌ ' + e.message, 'error');
    btn.disabled = false; btn.textContent = '✕ ยืนยันไม่อนุมัติ';
  }
}

    <div class="tab-row">

      <div class="tab" onclick="switchUtab(this,'ut-add')">➕ สร้างผู้ใช้ใหม่</div>
    </div>
    <div id="ut-list"><div class="loading-el">⏳ กำลังโหลด...</div></div>

      <div class="card">

          <div class="fgr"><div class="flbl">ชื่อ-นามสกุล <span class="req">*</span></div><input class="fin" id="nu-name" placeholder="เช่น สมชาย ใจดี"/></div>
          <div class="fgr"><div class="flbl">Username <span class="req">*</span></div><input class="fin" id="nu-user" placeholder="ภาษาอังกฤษ ไม่มีเว้นวรรค"/></div>
          <div class="fgr"><div class="flbl">รหัสผ่าน <span class="req">*</span></div><input class="fin" id="nu-pass" type="password" placeholder="อย่างน้อย 6 ตัว"/></div>
          <div class="fgr"><div class="flbl">ยืนยันรหัสผ่าน <span class="req">*</span></div><input class="fin" id="nu-pass2" type="password" placeholder="กรอกซ้ำ"/></div>

          <div class="fgr"><div class="flbl">สิทธิ์ <span class="req">*</span></div><select class="fin" id="nu-role"><option value="employee">พนักงาน</option><option value="admin">Admin</option></select></div>
        </div>
        <div style="margin-top:12px">
          <div class="flbl" style="margin-bottom:8px">หน้าที่เข้าถึงได้</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
            ${ALL_TABS.map(t=>`
              <label style="display:flex;align-items:center;gap:7px;font-size:12px;cursor:pointer;font-weight:700;padding:5px 8px;background:var(--gl);border-radius:7px">
                <input type="checkbox" id="nut-${t}" value="${t}" ${['dashboard','request','ledger','mylist','photos'].includes(t)?'checked':''}>

function switchUtab(e, id) {
  document.querySelectorAll('.tab-row .tab').forEach(t => t.classList.remove('active'));
  e.classList.add('active');
  el('ut-list').style.display = id==='ut-list'?'':'none';
  el('ut-add').style.display = id==='ut-add'?'':'none';
}

async function loadUserList() {
  loading('ut-list');
  try {
    const r = await apiGet('getUsers', {}, true);
    const rows = (r?.data||[]).map(u => `
      <tr>
        <td><div style="font-weight:800">${u.name||'-'}</div><div style="font-size:10px;color:var(--tx2);font-weight:600">${u.username||'-'}</div></td>
        <td style="font-weight:700">${u.branch||'-'}</td>
        <td><span class="badge ${u.role==='admin'?'bok':'brec'}">${u.role==='admin'?'Admin':'พนักงาน'}</span></td>
        <td style="font-size:11px;font-weight:600">${(u.tabs||'').split(',').length} หน้า</td>
        <td><span class="badge ${u.status==='active'?'bok':'bno'}">${u.status==='active'?'ใช้งาน':'ระงับ'}</span></td>
        <td>
          <button class="btn" style="font-size:10px;padding:3px 8px" onclick="doResetPass('${u.id}','${u.name}')">🔑 Reset</button>
          <button class="btn ${u.status==='active'?'btnr':''}" style="font-size:10px;padding:3px 8px;margin-left:3px" onclick="doToggleUser('${u.id}','${u.status}')">
            ${u.status==='active'?'🚫 ระงับ':'✅ เปิด'}
          </button>
        </td>
      </tr>`).join('') || '<tr><td colspan="6" class="empty-el">ไม่พบผู้ใช้</td></tr>';
    setHTML('ut-list', `
      <div class="card">
        <div class="ch"><span class="ct">👥 ผู้ใช้งานทั้งหมด</span><button class="btn btns" style="font-size:11px" onclick="loadUserList()">🔄 รีเฟรช</button></div>
        <table class="tbl">
          <tr><th>ชื่อ</th><th>สาขา</th><th>สิทธิ์</th><th>หน้าที่เข้าได้</th><th>สถานะ</th><th>จัดการ</th></tr>
          ${rows}
        </table>
      </div>`);
  } catch(e) { setHTML('ut-list', `<div class="empty-el">❌ ${e.message}</div>`); }
}

async function submitNewUser() {
  const name = val('nu-name').trim();
  const username = val('nu-user').trim();
  const pass = val('nu-pass');
  const pass2 = val('nu-pass2');
  const errEl = el('nu-err');
  const btn = el('nu-btn');
  if (!name||!username||!pass) { errEl.textContent = 'กรุณากรอกข้อมูลให้ครบ'; return; }
  if (pass.length < 6) { errEl.textContent = 'รหัสผ่านต้องมีอย่างน้อย 6 ตัว'; return; }
  if (pass !== pass2) { errEl.textContent = 'รหัสผ่านไม่ตรงกัน'; return; }
  if (!/^[a-zA-Z0-9_]+$/.test(username)) { errEl.textContent = 'Username ต้องเป็นภาษาอังกฤษหรือตัวเลข'; return; }
  const tabs = Array.from(document.querySelectorAll('[id^="nut-"]:checked')).map(i=>i.value).join(',');
  errEl.textContent = '';
  btn.disabled = true; btn.textContent = 'กำลังสร้าง...';
  try {
    await apiPost('createUser', { name, username, password: pass, branch: val('nu-branch'), role: val('nu-role'), tabs });
    showToast(`✓ สร้างผู้ใช้ ${name} สำเร็จ`, 'success');
    clearNewUser();
    switchUtab(document.querySelector('.tab-row .tab'), 'ut-list');
    loadUserList();
  } catch(e) { errEl.textContent = e.message; }
  btn.disabled = false; btn.textContent = '💾 สร้างผู้ใช้';
}

function clearNewUser() {
  ['nu-name','nu-user','nu-pass','nu-pass2'].forEach(id => { const e = el(id); if (e) e.value = ''; });
  el('nu-err').textContent = '';
}

async function doResetPass(uid, uname) {
  const np = prompt(`รหัสผ่านใหม่สำหรับ ${uname}:`);
  if (!np) return;
  if (np.length < 6) { showToast('รหัสผ่านต้องมีอย่างน้อย 6 ตัว', 'error'); return; }
  try { await apiPost('resetPassword', { userId: uid, newPassword: np }); showToast('✓ Reset รหัสผ่านสำเร็จ', 'success'); }
  catch(e) { showToast('❌ ' + e.message, 'error'); }
}

async function doToggleUser(uid, cur) {
  const ns = cur==='active'?'inactive':'active';
  if (!confirm(`ต้องการ${ns==='active'?'เปิดใช้งาน':'ระงับ'}ผู้ใช้นี้?`)) return;
  try { await apiPost('updateUserStatus', { userId: uid, status: ns }); showToast('✓ อัปเดตสถานะสำเร็จ', 'success'); loadUserList(); }
  catch(e) { showToast('❌ ' + e.message, 'error'); }
}
