<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>S.S.T ระบบเบิกจ่าย</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@tabler/icons@latest/icons-react/dist/index.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Sarabun',sans-serif;font-weight:600}
body{background:#F0F4F0;min-height:100vh}
:root{
  --g:#5BA85A;--gl:#EAF5EA;--gm:#8DC98C;--gd:#3A7A39;
  --r:#D45050;--rl:#FDEAEA;--or:#E09A30;--orl:#FEF3E0;
  --bl:#1A3A8A;--bll:#E8F0FE;--pu:#6A3AAA;--pul:#F0E8FE;
  --tx:#1C3D1C;--tx2:#4A6E4A;--tx3:#7A9A7A;
  --bd:#C8DEC8;--bg:#F0F4F0;--wh:#FFFFFF;--sb:#E4F0E4;
}

/* LOGIN */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#E4F0E4,#F0F4F0)}
.login-card{background:#fff;border-radius:20px;padding:40px 36px;width:360px;box-shadow:0 8px 32px rgba(91,168,90,.15);border:1.5px solid var(--bd)}
.login-logo{text-align:center;margin-bottom:24px}
.login-title{font-size:22px;font-weight:800;color:var(--tx);text-align:center;margin-bottom:4px}
.login-sub{font-size:13px;color:var(--tx2);text-align:center;margin-bottom:28px}
.login-label{font-size:12px;color:var(--tx2);font-weight:700;margin-bottom:5px;display:block}
.login-input{width:100%;padding:10px 14px;border:1.5px solid var(--bd);border-radius:10px;font-size:14px;color:var(--tx);font-family:'Sarabun',sans-serif;margin-bottom:14px}
.login-input:focus{outline:none;border-color:var(--g)}
.login-btn{width:100%;padding:12px;background:var(--g);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;font-family:'Sarabun',sans-serif}
.login-btn:hover{background:var(--gd)}
.login-err{color:var(--r);font-size:12px;text-align:center;margin-top:8px;min-height:18px}

/* APP LAYOUT */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:215px;background:var(--sb);border-right:1.5px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0}
.slogo{padding:14px 12px 12px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px}
.logo-name{font-size:14px;font-weight:800;color:var(--tx)}
.logo-sub{font-size:10px;color:var(--tx2);margin-top:1px;font-weight:600}
.nav{flex:1;padding:6px 5px;overflow-y:auto}
.ns{font-size:10px;font-weight:800;color:var(--tx3);padding:10px 8px 3px;text-transform:uppercase;letter-spacing:1px}
.ni{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;color:var(--tx2);margin-bottom:1px}
.ni:hover{background:rgba(91,168,90,.15)}
.ni.active{background:var(--g);color:#fff}
.nb{margin-left:auto;background:var(--r);color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;font-weight:800}
.su{padding:10px;border-top:1px solid var(--bd)}
.ucard{display:flex;align-items:center;gap:8px}
.uav{width:32px;height:32px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800}
.uname{font-size:12px;font-weight:800;color:var(--tx)}
.ubr{font-size:10px;color:var(--tx2);font-weight:600}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{padding:0 20px;height:52px;border-bottom:1.5px solid var(--bd);display:flex;align-items:center;justify-content:space-between;background:#fff;flex-shrink:0}
.pt{font-size:16px;font-weight:800;color:var(--tx)}
.ps{font-size:11px;color:var(--tx2);font-weight:600}
.content{flex:1;overflow-y:auto;padding:16px 20px;background:var(--bg)}
.panel{display:none}.panel.active{display:block}

/* COMPONENTS */
.card{background:#fff;border:1.5px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ct{font-size:13px;font-weight:800;color:var(--tx)}
.btn{padding:7px 14px;border-radius:8px;font-size:12px;cursor:pointer;border:1.5px solid var(--bd);background:#fff;color:var(--tx2);font-weight:700;display:inline-flex;align-items:center;gap:5px}
.btnp{background:var(--g);color:#fff;border-color:var(--g)}
.btns{border-color:var(--gm);color:var(--gd)}
.btnb{background:var(--bl);color:#fff;border-color:var(--bl)}
.btnr{background:var(--r);color:#fff;border-color:var(--r)}
.badge{display:inline-flex;padding:3px 8px;border-radius:14px;font-size:11px;font-weight:700}
.bw{background:var(--orl);color:#8A6000}
.bok{background:#E8F5E8;color:#2A6A2A}
.bno{background:var(--rl);color:#8A2020}
.brec{background:var(--bll);color:var(--bl)}
.bauto{background:var(--pul);color:var(--pu)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;padding:6px 8px;color:var(--tx2);border-bottom:1.5px solid var(--bd);font-weight:800;font-size:11px;text-transform:uppercase}
.tbl td{padding:8px;border-bottom:1px solid var(--gl);color:var(--tx);font-weight:600}
.tbl tr:hover td{background:#f5fbf5}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgr{display:flex;flex-direction:column;gap:4px}
.fgr.full{grid-column:1/-1}
.flbl{font-size:11px;color:var(--tx2);font-weight:800}
.flbl span{color:var(--r)}
.fin{padding:8px 10px;border:1.5px solid var(--bd);border-radius:8px;font-size:13px;color:var(--tx);background:#fff;width:100%;font-family:'Sarabun',sans-serif;font-weight:600}
.fin:focus{outline:none;border-color:var(--g)}
.ubox{border:2px dashed var(--gm);border-radius:10px;padding:16px;text-align:center;background:var(--gl);cursor:pointer}
.sig-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.sig-box{border:1.5px solid var(--bd);border-radius:8px;padding:8px 10px;background:var(--gl)}
.sig-lbl{font-size:10px;color:var(--tx3);font-weight:700;margin-bottom:3px}
.sig-name{font-size:12px;font-weight:800;color:var(--tx);border-bottom:1px solid var(--bd);padding-bottom:3px}
.sig-date{font-size:10px;color:var(--tx2);margin-top:2px;font-weight:600}
.hint{font-size:11px;color:var(--tx3);margin-top:8px;padding:7px 10px;background:var(--gl);border-radius:8px;display:flex;align-items:center;gap:5px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.sc{background:#fff;border:1.5px solid var(--bd);border-radius:12px;padding:12px 14px;position:relative;overflow:hidden}
.sc::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%}
.sc.wait::before{background:var(--or)}.sc.ok::before{background:var(--g)}.sc.no::before{background:var(--r)}.sc.total::before{background:var(--tx)}
.slbl{font-size:11px;color:var(--tx2);margin-bottom:3px;font-weight:700}
.sval{font-size:22px;font-weight:800;color:var(--tx)}
.sval.o{color:var(--or)}.sval.g{color:var(--g)}.sval.r{color:var(--r)}
.borrow-tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.btab{padding:7px 14px;border-radius:8px;font-size:12px;cursor:pointer;border:1.5px solid var(--bd);background:#fff;color:var(--tx2);font-weight:700}
.btab.active{background:var(--g);color:#fff;border-color:var(--g)}
.type-switch{display:flex;gap:4px;margin-bottom:12px;background:var(--gl);padding:4px;border-radius:9px}
.tsw{flex:1;padding:7px;border-radius:7px;text-align:center;cursor:pointer;font-size:12px;font-weight:700;color:var(--tx2);border:none;background:transparent}
.tsw.active{background:#fff;color:var(--gd);font-weight:800;border:1.5px solid var(--bd)}
.items-tbl{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:6px}
.items-tbl th{padding:6px 7px;background:var(--gl);color:var(--tx2);font-size:11px;font-weight:800;text-align:left;border-bottom:1px solid var(--bd)}
.items-tbl td{padding:5px 4px;border-bottom:1px solid var(--gl)}
.items-tbl td input,.items-tbl td select{border:1px solid var(--bd);border-radius:5px;padding:5px 6px;font-size:12px;width:100%;font-family:'Sarabun',sans-serif;font-weight:600}
.add-row-btn{color:var(--g);font-size:12px;cursor:pointer;font-weight:800;padding:5px 7px;display:inline-flex;align-items:center;gap:4px}
.veh-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.veh-card{background:#fff;border:1.5px solid var(--bd);border-radius:12px;padding:12px;cursor:pointer;text-align:center;position:relative}
.veh-card:hover{border-color:var(--g)}
.veh-card.selected{border-color:var(--g);border-width:2.5px;background:var(--gl)}
.veh-icon{font-size:30px;margin-bottom:6px;display:block}
.veh-plate{font-size:13px;font-weight:800;color:var(--tx);background:#FFF8E6;border:1px solid var(--or);border-radius:5px;padding:2px 8px;display:inline-block;margin-bottom:3px}
.veh-type{font-size:10px;color:var(--tx2);font-weight:600}
.veh-alert{position:absolute;top:6px;right:6px;width:18px;height:18px;background:var(--r);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:800}
.exp-cat{background:#fff;border:1.5px solid var(--bd);border-radius:10px;margin-bottom:8px;overflow:hidden}
.exp-cat-head{padding:10px 12px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;background:var(--gl)}
.exp-cat-head:hover{background:#dff0df}
.exp-cat-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--tx)}
.exp-cat-ico{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px}
.exp-cat-total{font-size:13px;font-weight:800;color:var(--gd)}
.auto-tag{font-size:9px;background:var(--pul);color:var(--pu);padding:2px 6px;border-radius:7px;font-weight:700}
.manual-tag{font-size:9px;background:var(--bll);color:var(--bl);padding:2px 6px;border-radius:7px;font-weight:700}
.exp-cat-body{padding:0 12px 10px}
.filter-bar{background:#fff;border:1.5px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:12px;display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.filter-group{display:flex;flex-direction:column;gap:3px}
.filter-lbl{font-size:11px;color:var(--tx2);font-weight:800}
.acard{background:#fff;border:1.5px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px}
.aico{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.aico.m{background:var(--gl)}.aico.f{background:var(--bll)}.aico.b{background:var(--orl)}.aico.rx{background:var(--rl)}
.ameta{flex:1}
.aname{font-size:12px;font-weight:800;color:var(--tx)}
.adet{font-size:11px;color:var(--tx2);margin-top:1px;font-weight:600}
.aact{display:flex;gap:5px;margin-top:7px;align-items:center}
.abtn-ok{padding:5px 11px;border-radius:6px;font-size:12px;border:none;background:var(--g);color:#fff;cursor:pointer;font-weight:800}
.abtn-no{padding:5px 11px;border-radius:6px;font-size:12px;border:1.5px solid var(--r);background:var(--rl);color:var(--r);cursor:pointer;font-weight:700}
.tab-row{display:flex;gap:4px;margin-bottom:12px}
.tab{padding:6px 14px;border-radius:8px;font-size:12px;cursor:pointer;border:1.5px solid var(--bd);background:#fff;color:var(--tx2);font-weight:700}
.tab.active{background:var(--g);color:#fff;border-color:var(--g)}
.rp{background:#fff;border:1.5px solid var(--bd);border-radius:10px;padding:14px;margin-top:8px}
.rp-head{text-align:center;border-bottom:1.5px solid var(--bd);padding-bottom:10px;margin-bottom:10px}
.loading{text-align:center;padding:30px;color:var(--tx2);font-size:13px;font-weight:600}
.empty{text-align:center;padding:24px;color:var(--tx3);font-size:12px;font-weight:600}
.alert-card{background:#fff;border:1.5px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px}
.alert-ico{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.alert-ico.urgent{background:var(--rl)}.alert-ico.warn{background:var(--orl)}
.alert-meta{flex:1}
.alert-title{font-size:12px;font-weight:800;color:var(--tx)}
.alert-sub{font-size:10px;color:var(--tx2);margin-top:2px;font-weight:600}
.alert-tag{display:inline-block;padding:2px 7px;border-radius:8px;font-size:10px;font-weight:700;margin-top:3px}
.tag-r{background:var(--rl);color:#8A2020}.tag-o{background:var(--orl);color:#8A6000}
.veh-detail-card{background:#fff;border:1.5px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:10px}
.veh-detail-head{background:var(--gl);padding:12px 14px;display:flex;align-items:center;gap:12px}
.exp-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 14px}
.exp-item{border:1.5px solid var(--bd);border-radius:8px;padding:8px 10px;text-align:center}
.exp-item.danger{border-color:var(--r);background:var(--rl)}
.exp-item.warn{border-color:var(--or);background:var(--orl)}
.exp-item.ok{border-color:var(--gm);background:var(--gl)}
.exp-label{font-size:10px;color:var(--tx2);font-weight:700;margin-bottom:3px}
.exp-date{font-size:12px;font-weight:800;color:var(--tx)}
.exp-days{font-size:10px;margin-top:2px;font-weight:700}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-title{font-size:13px;font-weight:800;color:var(--tx)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:10px}
.cal-day-lbl{text-align:center;font-size:10px;color:var(--tx2);font-weight:700;padding:4px 0}
.cal-day{text-align:center;padding:5px 2px;border-radius:6px;font-size:11px;color:var(--tx2);cursor:pointer;font-weight:600;min-height:30px}
.cal-day:hover{background:var(--gl)}
.cal-day.today{background:var(--g);color:#fff;font-weight:800}
.dot{width:5px;height:5px;border-radius:50%;margin:2px auto 0;display:block}
.dot-r{background:var(--r)}.dot-o{background:var(--or)}.dot-g{background:var(--g)}

/* TOAST */
#toast-container{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:10px 16px;border-radius:10px;font-size:13px;font-weight:700;font-family:'Sarabun',sans-serif;max-width:300px;animation:slideIn .2s ease;color:#fff}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

/* DOC PREVIEW */
.doc-preview{background:#fff;border:2px solid #333;border-radius:4px;padding:20px;position:relative;max-width:500px;margin:0 auto}
.doc-watermark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-30deg);font-size:48px;color:rgba(91,168,90,.07);font-weight:900;white-space:nowrap;pointer-events:none}
.doc-content{position:relative;z-index:1}
.doc-header{text-align:center;border-bottom:2px solid #333;padding-bottom:10px;margin-bottom:12px}
.doc-title{font-size:15px;font-weight:800;color:#000;letter-spacing:1px}
.doc-field-row{display:flex;gap:8px;margin-bottom:7px;font-size:12px;color:#111;font-weight:600}
.doc-field-row .fdlbl{width:140px;font-weight:800;color:#333;flex-shrink:0}
.doc-field-row .fdval{flex:1;border-bottom:1px solid #999;padding-bottom:2px;min-height:18px}
.doc-purpose{border:1px solid #333;border-radius:4px;padding:8px;min-height:50px;margin:8px 0;font-size:12px;color:#111;line-height:1.6;font-weight:600}
.doc-sig-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.doc-sig-box{text-align:center}
.doc-sig-line{border-top:1px solid #333;margin-top:28px;padding-top:4px;font-size:10px;color:#555;font-weight:600}
</style>
</head>
<body>

<!-- TOAST CONTAINER -->
<div id="toast-container"></div>

<!-- LOGIN PAGE -->
<div id="login-page" class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <img src="IMG_0012.JPG" alt="S.S.T Logo" style="width:80px;height:80px;object-fit:contain"/>
    </div>
    <div class="login-title">ศรีสุธา</div>
    <div class="login-sub">ระบบเบิกจ่ายและอนุมัติค่าใช้จ่าย</div>
    <label class="login-label">ชื่อผู้ใช้</label>
    <input class="login-input" id="inp-user" type="text" placeholder="username"/>
    <label class="login-label">รหัสผ่าน</label>
    <input class="login-input" id="inp-pass" type="password" placeholder="password" onkeydown="if(event.key==='Enter')doLogin()"/>
    <button class="login-btn" onclick="doLogin()">เข้าสู่ระบบ</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app-page" class="app" style="display:none">
  <div class="sidebar">
    <div class="slogo">
      <img src="IMG_0012.JPG" alt="S.S.T Logo" style="width:44px;height:44px;object-fit:contain;flex-shrink:0"/>
      <div><div class="logo-name">ศรีสุธา</div><div class="logo-sub">ระบบเบิกจ่าย</div></div>
    </div>
    <div class="nav" id="sidebar-nav"></div>
    <div class="su">
      <div class="ucard">
        <div class="uav" id="user-av">?</div>
        <div><div class="uname" id="user-name">-</div><div class="ubr" id="user-branch">-</div></div>
        <span onclick="doLogout()" style="margin-left:auto;cursor:pointer;color:var(--tx3);font-size:18px" title="ออกจากระบบ">⇥</span>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div><div class="pt" id="page-title">ภาพรวม</div><div class="ps" id="page-sub"></div></div>
      <div style="display:flex;gap:8px" id="topbar-actions"></div>
    </div>
    <div class="content" id="main-content">
      <div class="loading">กำลังโหลด...</div>
    </div>
  </div>
</div>

<script src="api.js"></script>
<script>
// ===================================================
// THAI DATE HELPERS
// ===================================================
const THAI_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const THAI_MONTHS_SHORT = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

function thaiDateNow() {
  const d = new Date();
  return `${d.getDate()} ${THAI_MONTHS[d.getMonth()]} ${d.getFullYear()+543}`;
}

function toThaiDate(str) {
  if (!str) return '-';
  const d = new Date(str);
  if (isNaN(d)) return str;
  return `${d.getDate()} ${THAI_MONTHS_SHORT[d.getMonth()]} ${d.getFullYear()+543}`;
}

// ===================================================
// NAV CONFIG
// ===================================================
const NAV = [
  { section: 'หลัก' },
  { id: 'dashboard', label: 'ภาพรวม', icon: '📊', tab: 'dashboard' },
  { section: 'ดำเนินการ' },
  { id: 'request', label: 'ขอเบิก', icon: '📋', tab: 'request' },
  { id: 'ledger', label: 'บันทึกรายจ่าย', icon: '📒', tab: 'ledger' },
  { section: 'ติดตาม' },
  { id: 'mylist', label: 'รายการของฉัน', icon: '📝', tab: 'mylist' },
  { id: 'photos', label: 'หลักฐานรูปภาพ', icon: '🖼️', tab: 'photos' },
  { section: 'ระบบรถ' },
  { id: 'vehicles', label: 'ข้อมูลรถ', icon: '🚗', tab: 'vehicles', badge: 'alert' },
  { id: 'calendar', label: 'แจ้งเตือน/ปฏิทิน', icon: '🔔', tab: 'calendar' },
  { section: 'Admin', adminOnly: true },
  { id: 'approve', label: 'อนุมัติรายการ', icon: '✅', tab: 'approve', badge: 'pending', adminOnly: true },

// ===================================================
// AUTH
// ===================================================
async function doLogin() {
  const username = document.getElementById('inp-user').value.trim();
  const password = document.getElementById('inp-pass').value;
  const errEl = document.getElementById('login-err');
  errEl.textContent = '';
  if (!username || !password) { errEl.textContent = 'กรุณากรอกชื่อผู้ใช้และรหัสผ่าน'; return; }
  try {
    showToast('กำลังเข้าสู่ระบบ...', 'loading');
    const user = await login(username, password);
    initApp(user);
  } catch (e) {
    errEl.textContent = e.message || 'เข้าสู่ระบบไม่สำเร็จ';
    showToast('เข้าสู่ระบบไม่สำเร็จ', 'error');
  }
}

function doLogout() {
  if (confirm('ต้องการออกจากระบบ?')) logout();
}

// ===================================================
// INIT APP
// ===================================================
function initApp(user) {
  document.getElementById('login-page').style.display = 'none';
  document.getElementById('app-page').style.display = 'flex';
  document.getElementById('user-name').textContent = user.name;
  document.getElementById('user-branch').textContent = `${user.branch} · ${user.role === 'admin' ? 'Admin' : 'พนักงาน'}`;
  document.getElementById('user-av').textContent = user.name.charAt(0);
  buildNav(user);
  showPanel('dashboard');
  startPolling(() => refreshCurrentPanel());
  loadPendingQueue();
  loadAlertCount();
  if (user.role === 'admin') loadPendingCount();
}

function buildNav(user) {
  const nav = document.getElementById('sidebar-nav');
  nav.innerHTML = '';
  NAV.forEach(item => {
    if (item.adminOnly && user.role !== 'admin') return;
    if (item.section) {
      nav.innerHTML += `<div class="ns">${item.section}</div>`;
      return;
    }
    if (!hasTab(item.tab)) return;
    nav.innerHTML += `
      <div class="ni" id="nav-${item.id}" onclick="showPanel('${item.id}')">
        <span>${item.icon}</span> ${item.label}
        ${item.badge ? `<span class="nb" id="badge-${item.badge}" style="display:none">0</span>` : ''}
      </div>`;
  });
}

async function loadPendingCount() {
  try {
    const r = await apiGet('getRequests', { status: 'pending' });
    pendingCount = r.data.length;
    const el = document.getElementById('badge-pending');
    if (el) { el.textContent = pendingCount; el.style.display = pendingCount > 0 ? '' : 'none'; }
  } catch(_) {}
}

async function loadAlertCount() {
  try {
    const r = await apiGet('getAlerts');
    alertCount = r.data.length;
    const el = document.getElementById('badge-alert');
    if (el) { el.textContent = alertCount; el.style.display = alertCount > 0 ? '' : 'none'; }
  } catch(_) {}
}

function showPanel(id) {
  currentPanel = id;
  document.querySelectorAll('.ni').forEach(n => n.classList.remove('active'));
  const navEl = document.getElementById(`nav-${id}`);
  if (navEl) navEl.classList.add('active');
  const [title, sub] = PAGE_TITLES[id] || [id, ''];
  document.getElementById('page-title').textContent = title;
  document.getElementById('page-sub').textContent = sub;
  const actions = document.getElementById('topbar-actions');
  actions.innerHTML = '';
  if (id === 'dashboard') {
    actions.innerHTML = `
      <button class="btn btns" onclick="showPanel('ledger')">📒 บันทึกรายจ่าย</button>
      <button class="btn btnp" onclick="showPanel('request')">+ ขอเบิก</button>`;
  }
  const content = document.getElementById('main-content');
  content.innerHTML = `<div class="loading">⏳ กำลังโหลด...</div>`;
  const panels = {
    dashboard: renderDashboard, request: renderRequest,
    ledger: renderLedger, mylist: renderMyList,
    photos: renderPhotos, vehicles: renderVehicles,
    calendar: renderCalendar, approve: renderApprove,
    report: renderReport, users: renderUsers,
  };
  if (panels[id]) panels[id]();
}

// ===================================================
// DASHBOARD
// ===================================================
async function renderDashboard() {
  try {
    const [reqRes, alertRes] = await Promise.all([
      apiGet('getRequests', {}),
      apiGet('getAlerts'),
    ]);
    const reqs = reqRes.data;
    const pending = reqs.filter(r => r.status === 'pending').length;
    const approved = reqs.filter(r => r.status === 'approved').length;
    const rejected = reqs.filter(r => r.status === 'rejected').length;
    const total = reqs.filter(r => r.status === 'approved').reduce((s, r) => s + (+r.amount || 0), 0);
    const alerts = alertRes.data;

    let alertBanner = '';
    if (alerts.length > 0) {
      alertBanner = `<div style="background:var(--rl);border:1.5px solid var(--r);border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;cursor:pointer" onclick="showPanel('calendar')">
        <span style="font-size:22px">🚗</span>
        <div style="flex:1"><div style="font-size:13px;font-weight:800;color:#8A2020">แจ้งเตือน: มีเอกสารรถที่ใกล้หมดอายุ ${alerts.length} รายการ</div>
        <div style="font-size:11px;color:#A03030;margin-top:1px">คลิกเพื่อดูปฏิทิน</div></div>
        <span style="color:var(--r)">›</span></div>`;
    }

    const recentRows = reqs.slice(-5).reverse().map(r => `
      <tr>
        <td>${r.date || '-'}</td>
        <td><span class="badge bw">${r.type}</span></td>
        <td>${r.purpose || '-'}</td>
        <td>${r.amount ? '฿'+Number(r.amount).toLocaleString() : '—'}</td>
        <td>${statusBadge(r.status)}</td>
      </tr>`).join('') || `<tr><td colspan="5" class="empty">ยังไม่มีรายการ</td></tr>`;

    document.getElementById('main-content').innerHTML = `
      ${alertBanner}
      <div class="stats">
        <div class="sc wait"><div class="slbl">รอดำเนินการ</div><div class="sval o">${pending}</div></div>
        <div class="sc ok"><div class="slbl">อนุมัติแล้ว</div><div class="sval g">${approved}</div></div>
        <div class="sc no"><div class="slbl">ไม่อนุมัติ</div><div class="sval r">${rejected}</div></div>
        <div class="sc total"><div class="slbl">ยอดรวมที่อนุมัติ</div><div class="sval" style="font-size:16px">฿${total.toLocaleString()}</div></div>
      </div>
      <div class="card">
        <div class="ch"><span class="ct">📋 รายการล่าสุด</span><span style="color:var(--g);cursor:pointer;font-size:12px;font-weight:700" onclick="showPanel('mylist')">ดูทั้งหมด →</span></div>
        <table class="tbl">
          <tr><th>วันที่</th><th>ประเภท</th><th>รายละเอียด</th><th>จำนวน</th><th>สถานะ</th></tr>
          ${recentRows}
        </table>
      </div>`;
  } catch(e) {
    document.getElementById('main-content').innerHTML = `<div class="empty">❌ ${e.message}</div>`;
  }
}

function statusBadge(s) {
  if (s === 'pending') return '<span class="badge bw">รอพิจารณา</span>';
  if (s === 'approved') return '<span class="badge bok">อนุมัติ</span>';
  if (s === 'rejected') return '<span class="badge bno">ไม่อนุมัติ</span>';
  return `<span class="badge">${s}</span>`;
}

function toggleRcpt(prefix) {
  const val = document.querySelector(`input[name="${prefix}-rcpt"]:checked`)?.value;
  const yes = document.getElementById(`${prefix}-rcpt-yes`);
  const no = document.getElementById(`${prefix}-rcpt-no`);
  if (yes) yes.style.display = val === 'yes' ? '' : 'none';

function addItemRow(tableId) {
  const tbl = document.getElementById(tableId);
  const rows = tbl.querySelectorAll('tr').length;
  const tr = document.createElement('tr');
  tr.innerHTML = `<td style="text-align:center;color:var(--tx3)">${rows}</td><td><input placeholder="ชื่อ"/></td><td><input placeholder="หน่วย" style="width:60px"/></td><td><input type="number" placeholder="1" style="width:50px"/></td><td><input placeholder=""/></td>`;

function previewFiles(inputId, previewId) {
  const files = document.getElementById(inputId)?.files;
  const preview = document.getElementById(previewId);
  if (!preview) return;
  preview.innerHTML = '';
  Array.from(files||[]).forEach(f => {
    const el = document.createElement('div');
    el.style.cssText = 'background:var(--gl);border:1px solid var(--bd);border-radius:6px;padding:5px 8px;font-size:11px;color:var(--tx2);font-weight:600';
    el.textContent = `📎 ${f.name}`;
    preview.appendChild(el);
  });
}

function getItemRows(tableId) {
  const rows = document.querySelectorAll(`#${tableId} tr`);
  const items = [];
  rows.forEach((r, i) => {
    if (i === 0) return;
    const inputs = r.querySelectorAll('input');
    if (inputs[0]?.value) items.push({ name: inputs[0].value, unit: inputs[1]?.value, qty: inputs[2]?.value, note: inputs[3]?.value });
  });
  return items;
}

async function submitFuel() {
  const user = getUser();
  const fuelType = document.getElementById('ft-f').classList.contains('active') ? 'ค่าน้ำมัน' :
                   document.getElementById('ft-r').classList.contains('active') ? 'ซ่อมรถ' : 'ค่าทางด่วน';
  let amount, purpose, files, previewId;
  if (fuelType === 'ค่าน้ำมัน') {
    amount = document.getElementById('fuel-amount')?.value;
    purpose = document.getElementById('fuel-detail')?.value || 'เติมน้ำมัน';
    files = document.getElementById('fuel-files')?.files;
    previewId = 'fuel-preview';
  } else if (fuelType === 'ซ่อมรถ') {
    amount = document.getElementById('rep-amount')?.value;
    purpose = document.getElementById('rep-detail')?.value || 'ซ่อมรถ';
    files = document.getElementById('rep-files')?.files;
    previewId = 'rep-preview';
  } else {
    amount = document.getElementById('toll-amount')?.value;
    purpose = document.getElementById('toll-route')?.value || 'ค่าทางด่วน';
    files = document.getElementById('toll-files')?.files;
    previewId = 'toll-preview';
  }
  if (!amount) { showToast('กรุณากรอกจำนวนเงิน', 'error'); return; }
  let imageUrls = '';
  if (files?.length) {
    const urls = await uploadImages(Array.from(files), fuelType, user.branch);
    imageUrls = urls.join(',');
  }
  enqueue('submitRequest', {
    type: fuelType, amount, purpose,
    vehiclePlate: selectedVehiclePlate,
    branch: user.branch, imageUrls,
  }, () => { showToast(`ส่งขอเบิก${fuelType}สำเร็จ`, 'success'); showPanel('mylist'); });
}

async function applyLedgerFilter() {
  const branch = document.getElementById('led-branch')?.value || 'all';
  const type = document.getElementById('led-type')?.value || 'all';
  try {
    const r = await apiGet('getLedger', { branch, type });
    const data = r.data;
    const groups = {};
    data.forEach(item => {
      const t = item.type || 'อื่นๆ';
      if (!groups[t]) groups[t] = [];
      groups[t].push(item);
    });
    const icons = { 'เบิกเงิน':'💵','เบิกซื้อของ':'🛒','เบิกของ':'📦','ค่าน้ำมัน':'⛽','ซ่อมรถ':'🔧','ค่าทางด่วน':'🛣️','รายจ่ายทั่วไป':'📋' };
    let html = '';
    if (!data.length) html = '<div class="empty">ไม่พบรายการ</div>';
    else {
      Object.entries(groups).forEach(([type, items]) => {
        const total = items.reduce((s, i) => s + (+i.amount||0), 0);
        const rows = items.map(i => `<tr>
          <td>${i.date||'-'}</td><td>${i.name||'-'}</td><td>${i.branch||'-'}</td>
          <td>${i.purpose||'-'}</td><td>${i.vehiclePlate||'-'}</td>
          <td>฿${(+i.amount||0).toLocaleString()}</td>
          <td><span class="badge ${i.source==='auto'?'bauto':'brec'}">${i.source==='auto'?'อัตโนมัติ':'กรอกเอง'}</span></td>
        </tr>`).join('');
        html += `<div class="exp-cat">
          <div class="exp-cat-head" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'':'none'">
            <div class="exp-cat-title"><div class="exp-cat-ico">${icons[type]||'📋'}</div>${type}
              <span class="${items[0]?.source==='auto'?'auto-tag':'manual-tag'}">${items[0]?.source==='auto'?'อัตโนมัติ':'กรอกเอง'}</span>
            </div>
            <div class="exp-cat-total">฿${total.toLocaleString()}</div>
          </div>
          <div class="exp-cat-body" style="display:none">
            <table class="tbl" style="margin-top:6px">
              <tr><th>วันที่</th><th>ชื่อ</th><th>สาขา</th><th>รายละเอียด</th><th>ทะเบียน</th><th>จำนวน</th><th>ที่มา</th></tr>
              ${rows}
            </table>
          </div>
        </div>`;
      });
      const grandTotal = data.reduce((s,i)=>s+(+i.amount||0),0);
      html += `<div style="background:#fff;border:1.5px solid var(--bd);border-radius:9px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:12px;color:var(--tx2);font-weight:700">ยอดรวมทั้งหมด</span>
        <span style="font-size:18px;font-weight:800;color:var(--gd)">฿${grandTotal.toLocaleString()}</span>
      </div>`;
    }
    document.getElementById('ledger-content').innerHTML = html;
  } catch(e) {
    document.getElementById('ledger-content').innerHTML = `<div class="empty">❌ ${e.message}</div>`;
  }
}

async function loadVehiclesList() {
  try {
    const r = await apiGet('getVehicles');
    const el = document.getElementById('vehicles-list');
    if (!r.data.length) { el.innerHTML = '<div class="empty">ยังไม่มีรถในระบบ</div>'; return; }
    el.innerHTML = r.data.map(v => {
      const today = new Date();
      function daysDiff(dateStr) {
        if (!dateStr) return null;
        const d = new Date(dateStr);
        return Math.ceil((d - today) / 86400000);
      }
      function expClass(days) {
        if (days === null) return 'ok';
        if (days <= 7) return 'danger';
        if (days <= 10) return 'warn';
        return 'ok';
      }
      function expText(days) {
        if (days === null) return '—';
        if (days < 0) return '⛔ หมดแล้ว';
        if (days <= 7) return `⚠ อีก ${days} วัน!`;
        if (days <= 10) return `⚠ อีก ${days} วัน`;
        return `อีก ${days} วัน`;
      }
      const prbDays = daysDiff(v.prbDate);
      const insDays = daysDiff(v.insurDate);
      const taxDays = daysDiff(v.taxDate);
      return `<div class="veh-detail-card">
        <div class="veh-detail-head">
          <div style="font-size:38px">${v.type?.includes('ตู้')?'🚌':'🚗'}</div>
          <div>
            <div class="veh-plate" style="font-size:15px">${v.plate}</div>
            <div style="font-size:11px;color:var(--tx2);margin-top:3px;font-weight:600">${v.type||''} · ${v.branch||''} · เพิ่มโดย ${v.addedBy||'-'}</div>
          </div>
        </div>
        <div class="exp-row">
          <div class="exp-item ${expClass(prbDays)}"><div class="exp-label">พ.ร.บ.</div><div class="exp-date">${toThaiDate(v.prbDate)}</div><div class="exp-days" style="color:${prbDays<=7?'var(--r)':prbDays<=10?'var(--or)':'var(--gd)'}">${expText(prbDays)}</div></div>
          <div class="exp-item ${expClass(insDays)}"><div class="exp-label">ประกันภัย</div><div class="exp-date">${toThaiDate(v.insurDate)}</div><div class="exp-days" style="color:${insDays<=7?'var(--r)':insDays<=10?'var(--or)':'var(--gd)'}">${expText(insDays)}</div></div>
          <div class="exp-item ${expClass(taxDays)}"><div class="exp-label">ภาษีประจำปี</div><div class="exp-date">${toThaiDate(v.taxDate)}</div><div class="exp-days" style="color:${taxDays<=7?'var(--r)':taxDays<=10?'var(--or)':'var(--gd)'}">${expText(taxDays)}</div></div>
        </div>
      </div>`;
    }).join('');
  } catch(e) {
    document.getElementById('vehicles-list').innerHTML = `<div class="empty">❌ ${e.message}</div>`;
  }
}

async function renderCalendar() {
  try {
    const r = await apiGet('getAlerts');
    const alerts = r.data;
    const now = new Date();
    const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
    const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).getDay();
    const alertDays = {};
    alerts.forEach(a => {
      const d = new Date(a.expDate);
      if (d.getMonth() === now.getMonth()) {
        alertDays[d.getDate()] = a.level;
      }
    });
    let calCells = '<div class="cal-day-lbl">อา</div><div class="cal-day-lbl">จ</div><div class="cal-day-lbl">อ</div><div class="cal-day-lbl">พ</div><div class="cal-day-lbl">พฤ</div><div class="cal-day-lbl">ศ</div><div class="cal-day-lbl">ส</div>';
    for (let i = 0; i < firstDay; i++) calCells += '<div class="cal-day"></div>';
    for (let d = 1; d <= daysInMonth; d++) {
      const isToday = d === now.getDate();
      const level = alertDays[d];
      calCells += `<div class="cal-day ${isToday?'today':''}">${d}${level?`<span class="dot dot-${level==='urgent'?'r':'o'}"></span>`:''}${isToday&&!level?'<span class="dot dot-g"></span>':''}</div>`;
    }
    const alertCards = alerts.length ? alerts.map(a => `
      <div class="alert-card">
        <div class="alert-ico ${a.level}">${a.level==='urgent'?'⚠️':'🗓️'}</div>
        <div class="alert-meta">
          <div class="alert-title">${a.field==='prbDate'?'พ.ร.บ.':a.field==='insurDate'?'ประกันภัย':'ภาษีประจำปี'} · ${a.plate}</div>
          <div class="alert-sub">หมดอายุ ${toThaiDate(a.expDate)} · สาขา ${a.branch}</div>
          <span class="alert-tag ${a.level==='urgent'?'tag-r':'tag-o'}">${a.level==='urgent'?'🔴':'🟠'} อีก ${a.daysLeft} วัน</span>
        </div>
        <button class="btn btnp" style="font-size:10px;align-self:flex-start" onclick="showDoneAlert('${a.vehicleId}','${a.field}','${a.plate}')">✅ ดำเนินการแล้ว</button>
      </div>`).join('') : '<div class="empty">✅ ไม่มีการแจ้งเตือนในขณะนี้</div>';

    document.getElementById('main-content').innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="card">
          <div class="cal-header">
            <span class="cal-title">${THAI_MONTHS[now.getMonth()]} ${now.getFullYear()+543}</span>
          </div>
          <div class="cal-grid">${calCells}</div>
          <div style="display:flex;gap:10px;font-size:10px;color:var(--tx2);padding-top:6px;border-top:1px solid var(--gl);font-weight:600">
            <span>🔴 เร่งด่วน</span><span>🟠 ใกล้ถึง</span><span>🟢 วันนี้</span>
          </div>
        </div>
        <div>
          <div style="font-size:13px;font-weight:800;color:var(--tx);margin-bottom:8px">รายการแจ้งเตือน</div>
          ${alertCards}
        </div>
      </div>
      <div id="done-alert-form" style="display:none"></div>`;
  } catch(e) {
    document.getElementById('main-content').innerHTML = `<div class="empty">❌ ${e.message}</div>`;
  }
}

          <div class="aact">

            <button class="abtn-no" onclick="doReject('${item.id}')">✕ ไม่อนุมัติ</button>
          </div>
        </div>
        <div style="text-align:right">
          <div style="font-size:14px;font-weight:800;color:var(--tx)">${item.amount?'฿'+Number(item.amount).toLocaleString():'—'}</div>
          <span class="badge bw">รอ</span>

    document.getElementById('main-content').innerHTML = `
      <div style="background:var(--pul);border:1.5px solid #C8A8F0;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:12px;color:var(--pu);display:flex;align-items:center;gap:7px;font-weight:700">

  } catch(e) {
    document.getElementById('main-content').innerHTML = `<div class="empty">❌ ${e.message}</div>`;
  }
}

async function doApprove(id) {
  if (!confirm('ยืนยันการอนุมัติ?')) return;
  try {
    await apiPost('approveRequest', { id });
    showToast('อนุมัติสำเร็จ', 'success');
    renderApprove();
    loadPendingCount();
  } catch(e) { showToast(e.message, 'error'); }
}

async function doReject(id) {
  const reason = prompt('เหตุผลที่ไม่อนุมัติ (ถ้ามี):');
  if (reason === null) return;
  try {
    await apiPost('rejectRequest', { id, reason });
    showToast('บันทึกการไม่อนุมัติแล้ว', 'success');
    renderApprove();
    loadPendingCount();
  } catch(e) { showToast(e.message, 'error'); }
}

          <tr><th>#</th><th>วันที่</th><th>หมวด</th><th>รายละเอียด</th><th>ทะเบียน</th><th>จำนวน</th></tr>
          ${rows || '<tr><td colspan="6" class="empty">ไม่พบข้อมูล</td></tr>'}
        </table>
        <div style="text-align:right;font-size:13px;font-weight:800;color:var(--tx);margin-top:8px;padding-top:6px;border-top:1.5px solid var(--bd)">ยอดรวม ฿${total.toLocaleString()}</div>
        <div class="sig-row" style="margin-top:12px">
          <div class="sig-box"><div class="sig-lbl">ผู้รับผิดชอบ</div><div class="sig-name">${user?.name||'-'}</div><div class="sig-date">${thaiDateNow()}</div></div>
          <div class="sig-box"><div class="sig-lbl">ผู้อนุมัติ</div><div class="sig-name" style="color:var(--tx3);font-style:italic">.....................</div><div class="sig-date">—</div></div>
        </div>
      </div>`;
  } catch(e) { showToast(e.message, 'error'); }
}

async function loadVehicleReport() {
  const type = document.getElementById('rpt-vtype')?.value;
  const plate = document.getElementById('rpt-plate')?.value;
  try {
    const r = await apiGet('getLedger', { type });
    let data = r.data;
    if (plate) data = data.filter(i => i.vehiclePlate === plate);
    const total = data.reduce((s,i)=>s+(+i.amount||0),0);
    const rows = data.map((i,idx)=>`<tr><td>${idx+1}</td><td>${i.date||'-'}</td><td>${i.type||'-'}</td><td>${i.purpose||'-'}</td><td>${i.vehiclePlate||'-'}</td><td>฿${(+i.amount||0).toLocaleString()}</td></tr>`).join('');
    document.getElementById('vehicle-report-content').innerHTML = `
      <div class="rp">
        <div class="rp-head">
          <div style="font-size:13px;font-weight:800;color:var(--tx)">รายงานค่าใช้จ่ายรถ${plate?' — ทะเบียน '+plate:''}</div>
          <div style="font-size:11px;color:var(--tx2);font-weight:600">พิมพ์วันที่ ${thaiDateNow()}</div>
        </div>
        <table class="tbl">
          <tr><th>#</th><th>วันที่</th><th>ประเภท</th><th>รายละเอียด</th><th>ทะเบียน</th><th>จำนวน</th></tr>
          ${rows||'<tr><td colspan="6" class="empty">ไม่พบข้อมูล</td></tr>'}
        </table>
        <div style="text-align:right;font-size:13px;font-weight:800;margin-top:8px;padding-top:6px;border-top:1.5px solid var(--bd)">ยอดรวม ฿${total.toLocaleString()}</div>
      </div>`;
  } catch(e) { showToast(e.message, 'error'); }
}

// ===================================================
// USERS
// ===================================================
async function renderUsers() {
  if (!isAdmin()) { document.getElementById('main-content').innerHTML = '<div class="empty">ไม่มีสิทธิ์เข้าถึง</div>'; return; }

  const ALL_TABS = ['dashboard','request','ledger','mylist','photos','vehicles','calendar','approve','report','users'];
  const TAB_LABELS = { dashboard:'ภาพรวม', request:'ขอเบิก', ledger:'บันทึกรายจ่าย', mylist:'รายการของฉัน', photos:'หลักฐานรูปภาพ', vehicles:'ระบบรถ', calendar:'แจ้งเตือน/ปฏิทิน', approve:'อนุมัติ (Admin)', report:'รายงาน (Admin)', users:'จัดการผู้ใช้ (Admin)' };

  document.getElementById('main-content').innerHTML = `
    <div class="tab-row">
      <div class="tab active" onclick="switchUserTab(this,'ut-list')">👥 ผู้ใช้ทั้งหมด</div>
      <div class="tab" onclick="switchUserTab(this,'ut-add')">➕ สร้างผู้ใช้ใหม่</div>
    </div>

    <!-- รายชื่อ -->
    <div id="ut-list">
      <div id="user-list-content"><div class="loading">⏳ กำลังโหลด...</div></div>
    </div>

    <!-- สร้างใหม่ -->
    <div id="ut-add" style="display:none">
      <div class="card">
        <div class="ch"><span class="ct">➕ สร้างผู้ใช้ใหม่</span></div>
        <div class="fg">
          <div class="fgr"><div class="flbl">ชื่อ-นามสกุล <span>*</span></div><input class="fin" id="nu-name" placeholder="เช่น สมชาย ใจดี"/></div>
          <div class="fgr"><div class="flbl">ชื่อผู้ใช้ (username) <span>*</span></div><input class="fin" id="nu-user" placeholder="ภาษาอังกฤษ ไม่มีเว้นวรรค"/></div>
          <div class="fgr"><div class="flbl">รหัสผ่าน <span>*</span></div><input class="fin" id="nu-pass" type="password" placeholder="อย่างน้อย 6 ตัวอักษร"/></div>
          <div class="fgr"><div class="flbl">ยืนยันรหัสผ่าน <span>*</span></div><input class="fin" id="nu-pass2" type="password" placeholder="กรอกรหัสผ่านอีกครั้ง"/></div>
          <div class="fgr"><div class="flbl">สาขา <span>*</span></div><select class="fin" id="nu-branch"><option>สาขา 1</option><option>สาขา 2</option></select></div>
          <div class="fgr"><div class="flbl">สิทธิ์ <span>*</span></div><select class="fin" id="nu-role"><option value="employee">พนักงาน</option><option value="admin">Admin</option></select></div>
        </div>
        <div style="margin-top:12px">
          <div class="flbl" style="margin-bottom:8px">สิทธิ์การเข้าถึงหน้าต่างๆ</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px" id="nu-tabs">
            ${ALL_TABS.map(t => `
              <label style="display:flex;align-items:center;gap:7px;font-size:12px;cursor:pointer;font-weight:700;padding:5px 8px;background:var(--gl);border-radius:7px">
                <input type="checkbox" id="nut-${t}" value="${t}" ${['dashboard','request','ledger','mylist','photos'].includes(t)?'checked':''}>
                ${TAB_LABELS[t]}
              </label>`).join('')}
          </div>
        </div>
        <div id="nu-err" style="color:var(--r);font-size:12px;margin-top:8px;font-weight:700;min-height:18px"></div>
        <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end">
          <button class="btn" onclick="clearNewUser()">ล้างข้อมูล</button>
          <button class="btn btnp" onclick="submitNewUser()">💾 สร้างผู้ใช้</button>
        </div>
      </div>
    </div>`;

  loadUserList();
}

function switchUserTab(el, id) {
  document.querySelectorAll('.tab-row .tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('ut-list').style.display = id === 'ut-list' ? '' : 'none';
  document.getElementById('ut-add').style.display = id === 'ut-add' ? '' : 'none';
}

async function loadUserList() {
  const el = document.getElementById('user-list-content');
  if (!el) return;
  try {
    const r = await apiGet('getUsers');
    if (!r) return;
    const rows = r.data.map(u => `
      <tr>
        <td><div style="font-weight:800">${u.name||'-'}</div><div style="font-size:10px;color:var(--tx2);font-weight:600">${u.username||'-'}</div></td>
        <td style="font-weight:700">${u.branch||'-'}</td>
        <td><span class="badge ${u.role==='admin'?'bok':'brec'}">${u.role==='admin'?'Admin':'พนักงาน'}</span></td>
        <td style="font-size:11px;font-weight:600">${(u.tabs||'').split(',').length} หน้า</td>
        <td><span style="color:${u.tabs?.includes('vehicles')?'var(--g)':'var(--tx3)'};font-weight:700">${u.tabs?.includes('vehicles')?'✓':'—'}</span></td>
        <td><span class="badge ${u.status==='active'?'bok':'bno'}">${u.status==='active'?'ใช้งาน':'ระงับ'}</span></td>
        <td>
          <button class="btn" style="font-size:10px;padding:3px 8px" onclick="resetPassword('${u.id}','${u.name}')">🔑 Reset</button>
          <button class="btn ${u.status==='active'?'btnr':''}" style="font-size:10px;padding:3px 8px;margin-left:3px" onclick="toggleUserStatus('${u.id}','${u.status}')">
            ${u.status==='active'?'🚫 ระงับ':'✅ เปิด'}
          </button>
        </td>
      </tr>`).join('') || '<tr><td colspan="7" class="empty">ไม่พบผู้ใช้</td></tr>';

    el.innerHTML = `
      <div class="card">
        <div class="ch"><span class="ct">👥 ผู้ใช้งานทั้งหมด (${r.data.length} คน)</span>
          <button class="btn btns" style="font-size:11px" onclick="loadUserList()">🔄 รีเฟรช</button>
        </div>
        <table class="tbl">
          <tr><th>ชื่อ</th><th>สาขา</th><th>สิทธิ์</th><th>หน้าที่เข้าได้</th><th>ระบบรถ</th><th>สถานะ</th><th>จัดการ</th></tr>
          ${rows}
        </table>
      </div>`;
  } catch(e) {
    if (el) el.innerHTML = `<div class="empty">❌ ${e.message}</div>`;
  }
}

async function submitNewUser() {
  const name = document.getElementById('nu-name')?.value.trim();
  const username = document.getElementById('nu-user')?.value.trim();
  const pass = document.getElementById('nu-pass')?.value;
  const pass2 = document.getElementById('nu-pass2')?.value;
  const branch = document.getElementById('nu-branch')?.value;
  const role = document.getElementById('nu-role')?.value;
  const errEl = document.getElementById('nu-err');

  if (!name || !username || !pass) { errEl.textContent = 'กรุณากรอกข้อมูลให้ครบ'; return; }
  if (pass.length < 6) { errEl.textContent = 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร'; return; }
  if (pass !== pass2) { errEl.textContent = 'รหัสผ่านไม่ตรงกัน'; return; }
  if (!/^[a-zA-Z0-9_]+$/.test(username)) { errEl.textContent = 'ชื่อผู้ใช้ต้องเป็นภาษาอังกฤษหรือตัวเลขเท่านั้น'; return; }

  const tabs = Array.from(document.querySelectorAll('#nu-tabs input:checked')).map(i => i.value).join(',');
  errEl.textContent = '';

  try {
    showToast('กำลังสร้างผู้ใช้...', 'loading');
    await apiPost('createUser', { name, username, password: pass, branch, role, tabs });
    showToast(`สร้างผู้ใช้ ${name} สำเร็จ`, 'success');
    clearNewUser();
    switchUserTab(document.querySelector('.tab-row .tab'), 'ut-list');
    loadUserList();
  } catch(e) {
    errEl.textContent = e.message;
    showToast(e.message, 'error');
  }
}

function clearNewUser() {
  ['nu-name','nu-user','nu-pass','nu-pass2'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  document.getElementById('nu-err').textContent = '';
}

async function resetPassword(userId, userName) {
  const newPass = prompt(`รหัสผ่านใหม่สำหรับ ${userName}:`);
  if (!newPass) return;
  if (newPass.length < 6) { showToast('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร', 'error'); return; }
  try {
    await apiPost('resetPassword', { userId, newPassword: newPass });
    showToast(`Reset รหัสผ่าน ${userName} สำเร็จ`, 'success');
  } catch(e) { showToast(e.message, 'error'); }
}

async function toggleUserStatus(userId, currentStatus) {
  const newStatus = currentStatus === 'active' ? 'inactive' : 'active';
  const action = newStatus === 'active' ? 'เปิดใช้งาน' : 'ระงับ';
  if (!confirm(`ต้องการ${action}ผู้ใช้นี้?`)) return;
  try {
    await apiPost('updateUserStatus', { userId, status: newStatus });
    showToast(`${action}ผู้ใช้สำเร็จ`, 'success');
    loadUserList();
  } catch(e) { showToast(e.message, 'error'); }
}

// ===================================================
// STARTUP — ตรวจสอบ login เดิม
// ===================================================
window.addEventListener('load', () => {
  const user = getUser();
  const token = localStorage.getItem('sst_token');
  if (user && token) {
    initApp(user);
  }
  // โหลด vehicles สำหรับฟอร์มน้ำมัน ตอน tab เปิด
  document.addEventListener('click', e => {
    if (e.target.textContent?.includes('รถ/เดินทาง')) {
      setTimeout(() => loadVehicleCards(), 300);
    }
  });
});
